<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>村瀨亮介 3D Model Preview</title>

  <!-- ファビコン設定 -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

  <!-- Google model-viewer スクリプト読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* ==========================================================================
       1. デザインシステム & CSS変数定義
       ========================================================================== */
    :root {
      --bg-default: #666666;
      --panel-bg: rgba(15, 18, 24, 0.88);
      --panel-border: rgba(255, 255, 255, 0.15);
      
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-bg-hover: rgba(255, 255, 255, 0.18);
      --btn-border: rgba(255, 255, 255, 0.12);
      --btn-border-hover: rgba(255, 255, 255, 0.3);
      
      --accent-blue: #2563eb;
      --accent-blue-border: #3b82f6;
      --accent-blue-glow: rgba(37, 99, 235, 0.6);
      
      --accent-red: #e11d48;
      --accent-red-border: #f43f5e;
      --accent-red-glow: rgba(225, 29, 72, 0.7);

      --gt-green: #34d399; /* GT7 良好インジケータ色 */

      --text-main: #ffffff;
      --text-sub: #e5e7eb;
      --text-muted: rgba(255, 255, 255, 0.4);

      --panel-radius: 22px;
      --btn-radius: 12px;
      --blur-strength: 20px;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-default);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.3s ease;
    }

    /* 背景用リアカメラ映像 */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* 3Dキャンバス */
    model-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      transition: filter 0.3s ease;
      z-index: 1;
    }

    /* ==========================================================================
       2. GT7 / スーパーフォーミュラ風 レーシングスペックUI (左側)
       ========================================================================== */
    .gt-spec-overlay {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 20;
      max-width: 320px;
      color: var(--text-main);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      opacity: 1;
      transform: translateX(0);
      /* フェードイン・フェードアウト用トランジション */
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    /* スマホ自動消去・トグル用クラス */
    .gt-spec-overlay.is-hidden {
      opacity: 0 !important;
      transform: translateX(-24px) !important;
      pointer-events: none !important;
    }

    /* フォーミュラ風 ブランドロゴバッジ */
    .gt-formula-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .gt-country {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2px;
      letter-spacing: 0.05em;
    }

    .gt-name-main {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: #ffffff;
    }

    .gt-name-sub {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    /* GT7風 カプセル PP バッジ */
    .gt-pp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 2px 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: rgba(0, 0, 0, 0.35);
    }

    /* GT7風 水平パーティングライン */
    .gt-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
      margin-bottom: 10px;
    }

    /* スペック項目グリッド */
    .gt-spec-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .gt-spec-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .gt-spec-label {
      width: 68px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .gt-spec-val {
      font-weight: 600;
      color: #ffffff;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .gt-spec-val span {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      margin-left: 2px;
    }

    /* GT7風 メカニカル・コンディションランプ */
    .gt-status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .gt-status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .gt-status-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.5);
    }

    .gt-status-icon {
      font-size: 11px;
    }

    .gt-status-text {
      font-size: 9px;
      font-weight: 700;
      color: var(--gt-green);
      letter-spacing: 0.04em;
    }

    /* モバイル向け 再表示トリガーボタン */
    .gt-mobile-toggle-btn {
      position: absolute;
      top: 18px;
      left: 16px;
      z-index: 25;
      background: rgba(15, 18, 24, 0.75);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
    }

    .gt-mobile-toggle-btn:active {
      transform: scale(0.95);
    }

    /* ==========================================================================
       3. ビューワーコントロール & ARボタン
       ========================================================================== */
    .ar-fab-btn {
      position: absolute;
      top: 20px;
      right: 16px;
      z-index: 100;
      background: rgba(37, 99, 235, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .ar-fab-btn:active {
      transform: scale(0.95);
      background: #1d4ed8;
    }

    .holo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 240, 255, 0.08) 0px,
        rgba(0, 240, 255, 0.08) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    .holo-overlay.active {
      opacity: 1;
    }

    /* ==========================================================================
       4. コントロールパネル UI
       ========================================================================== */
    .controls-panel {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: calc(100% - 24px);
      max-width: 980px;
      background: var(--panel-bg);
      padding: 10px 14px;
      border-radius: var(--panel-radius);
      backdrop-filter: blur(var(--blur-strength));
      -webkit-backdrop-filter: blur(var(--blur-strength));
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .divider {
      width: 1px;
      height: 20px;
      background-color: var(--text-muted);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--text-sub);
      border: 1px solid var(--btn-border);
      min-height: 38px;
      padding: 6px 14px;
      border-radius: var(--btn-radius);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: all var(--transition-fast);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:hover {
      color: var(--text-main);
      background: var(--btn-bg-hover);
      border-color: var(--btn-border-hover);
    }

    .btn.active {
      color: var(--text-main);
      background: var(--accent-blue);
      border-color: var(--accent-blue-border);
      font-weight: 600;
      box-shadow: 0 0 12px var(--accent-blue-glow);
    }

    .btn.fast-active {
      color: var(--text-main);
      background: var(--accent-red);
      border-color: var(--accent-red-border);
      font-weight: 600;
      box-shadow: 0 0 16px var(--accent-red-glow);
      animation: pulse 1s infinite alternate;
    }

    .scale-label {
      color: var(--text-sub);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      padding: 0 4px;
    }

    .scale-slider {
      width: 70px;
      height: 24px;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    .color-picker-label {
      position: relative;
      overflow: hidden;
    }

    .color-picker-label input[type="color"] {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* ==========================================================================
       5. スマホ向けレスポンシブ最適化
       ========================================================================== */
    @media (max-width: 640px) {
      .gt-spec-overlay {
        top: 60px;
        left: 20px;
        max-width: 280px;
      }

      .gt-mobile-toggle-btn {
        display: inline-flex;
      }

      .controls-panel {
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        width: calc(100% - 16px);
        padding: 8px 10px;
        gap: 8px;
        justify-content: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .controls-panel::-webkit-scrollbar {
        display: none;
      }

      .btn {
        min-height: 40px;
        padding: 8px 14px;
        font-size: 13px;
      }

      .scale-slider {
        width: 60px;
      }

      .ar-fab-btn {
        top: 14px;
        right: 14px;
        padding: 10px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <!-- 背景用リアカメラビデオ要素 -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <!-- ホログラムモード用エフェクトオーバーレイ -->
  <div id="holoOverlay" class="holo-overlay"></div>

  <!-- スマホ用 SPEC 再表示トグルボタン -->
  <button id="gtToggleBtn" class="gt-mobile-toggle-btn">
    ℹ️ SPEC
  </button>

  <!-- GT7 / フォーミュラ風 スペックオーバーレイ (左上配置) -->
  <div id="gtSpecOverlay" class="gt-spec-overlay">
    <!-- フォーミュラ風 カテゴリバッジ -->
    <div class="gt-formula-badge">FORMULA SPEC</div>

    <!-- 国旗 & 地域表示 -->
    <div class="gt-country">
      <span>🇯🇵</span>
      <span>北海道 旭川 / ASAHIKAWA HOKKAIDO</span>
    </div>

    <!-- ネーム & モデル年式 -->
    <div class="gt-name-main">村瀨亮介 '96</div>
    <div class="gt-name-sub">Ryosuke MURASE / Single-Seater Humanoid</div>

    <!-- GT7風 PP バッジ (PP 596.24) -->
    <div class="gt-pp-badge">
      PP 596.24
    </div>

    <!-- パーティングライン -->
    <div class="gt-divider"></div>

    <!-- スペック表 -->
    <div class="gt-spec-list">
      <div class="gt-spec-row">
        <span class="gt-spec-label">車両乾燥重量</span>
        <span class="gt-spec-val">87<span>kg</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">全高 (身長)</span>
        <span class="gt-spec-val">172<span>cm</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">駆動形式</span>
        <span class="gt-spec-val">MR<span>(ミッドシップ 2WD)</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">主要燃料</span>
        <span class="gt-spec-val">カレー<span>(Curry & Spices)</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">総ポリゴン</span>
        <span class="gt-spec-val" id="specPolyVal">15,000<span>Tris</span></span>
      </div>
    </div>

    <!-- GT7風 メカニカル・コンディションインジケータ -->
    <div class="gt-status-row">
      <div class="gt-status-item">
        <span class="gt-status-tag">PU</span>
        <span class="gt-status-icon">⚙️</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">CHASSIS</span>
        <span class="gt-status-icon">🛡️</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">ENERGY</span>
        <span class="gt-status-icon">⚡</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">SYSTEM</span>
        <span class="gt-status-icon">🟢</span>
        <span class="gt-status-text">良好</span>
      </div>
    </div>
  </div>

  <!-- 3Dモデルビューワー -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    scale="0.5 0.5 0.5"
    camera-orbit="90deg 75deg auto"
    camera-target="0m 0m 0m"
    auto-rotate 
    rotation-per-second="30deg"
    camera-controls 
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <!-- カスタム AR ボタン (Google model-viewer slot) -->
    <button slot="ar-button" class="ar-fab-btn">
      👓 AR表示
    </button>
  </model-viewer>

  <!-- 下部コントロールパネルUI -->
  <div class="controls-panel">
    <!-- 1. ポリゴン数精度切り替え -->
    <div class="group">
      <button class="btn" data-src="./murase_statue_bust_500p_low.glb" data-poly="500">500p</button>
      <button class="btn active" data-src="./murase_statue_bust_15k_standard.glb" data-poly="15,000">15k</button>
      <button class="btn" data-src="./murase_statue_bust_70k_raw.glb" data-poly="70,000">70k</button>
    </div>

    <div class="divider"></div>

    <!-- 2. シェーディング表示モード切り替え -->
    <div class="group" id="viewModeGroup">
      <button class="btn active" data-mode="normal">標準</button>
      <button class="btn" data-mode="solid">ソリッド</button>
      <button class="btn" data-mode="hologram">ホロ</button>
      <button class="btn" data-mode="mesh">メッシュ</button>
    </div>

    <div class="divider"></div>

    <!-- 3. 回転アニメーション制御 -->
    <div class="group">
      <button class="btn active" id="toggleRotateBtn" title="自動回転 ON/OFF">回転</button>
      <button class="btn" id="fastRotateBtn" title="高速回転">🎠</button>
    </div>

    <div class="divider"></div>

    <!-- 4. モデルサイズスライダー -->
    <div class="group">
      <label class="scale-label" title="拡大・縮小">
        📏
        <input type="range" id="scaleSlider" class="scale-slider" min="0.1" max="1.5" step="0.05" value="0.5">
      </label>
    </div>

    <div class="divider"></div>

    <!-- 5. 背景環境カスタマイズ -->
    <div class="group">
      <button class="btn" id="cameraBtn" title="カメラ背景を取り込む">📷</button>

      <label class="btn color-picker-label" title="背景色を変更">
        🎨
        <input type="color" id="bgColorPicker" value="#666666">
      </label>

      <label class="btn" title="背景画像を読み込む">
        🖼️
        <input type="file" id="bgImgInput" accept="image/*">
      </label>

      <button class="btn" id="resetBgBtn" title="既定の状態に戻す">↺</button>
    </div>

    <div class="divider"></div>

    <!-- 6. ダウンロード & 外部リンク -->
    <div class="group">
      <button class="btn" id="downloadBtn" title="選択中のモデル (.glb) をダウンロード">📥 DL</button>
      <a class="btn" href="https://github.com/MuraseRyosuke/Murase-Ryosuke-3D-Model" target="_blank" rel="noopener noreferrer" title="GitHub リポジトリを開く">🐙 GitHub</a>
    </div>
  </div>

  <!-- スクリプト制御ロジック -->
  <script>
    (() => {
      'use strict';

      /* ==========================================================================
         1. 設定 ＆ 定数
         ========================================================================== */
      const CONFIG = {
        DEFAULT_SCALE: 0.5,
        DEFAULT_BG_COLOR: '#666666',
        NORMAL_ROTATION_SPEED: '30deg',
        FAST_ROTATION_SPEED: '1440deg',
        MOVE_STEP: 0.05
      };

      /* ==========================================================================
         2. アプリケーション状態
         ========================================================================== */
      const isMobileDevice = window.innerWidth <= 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      const STATE = {
        currentMode: 'normal',
        isFastRotating: false,
        isCameraActive: false,
        cameraStream: null,
        originalMaterials: [],
        position: { x: 0, y: 0, z: 0 },
        isMobile: isMobileDevice
      };

      /* ==========================================================================
         3. DOM要素キャッシュ
         ========================================================================== */
      const DOM = {
        viewer: document.getElementById('viewer'),
        gtSpecOverlay: document.getElementById('gtSpecOverlay'),
        gtToggleBtn: document.getElementById('gtToggleBtn'),
        specPolyVal: document.getElementById('specPolyVal'),
        modelButtons: document.querySelectorAll('.controls-panel .group:first-child .btn'),
        modeButtons: document.querySelectorAll('#viewModeGroup .btn'),
        holoOverlay: document.getElementById('holoOverlay'),
        toggleRotateBtn: document.getElementById('toggleRotateBtn'),
        fastRotateBtn: document.getElementById('fastRotateBtn'),
        scaleSlider: document.getElementById('scaleSlider'),
        cameraBtn: document.getElementById('cameraBtn'),
        cameraVideo: document.getElementById('cameraVideo'),
        bgColorPicker: document.getElementById('bgColorPicker'),
        bgImgInput: document.getElementById('bgImgInput'),
        resetBgBtn: document.getElementById('resetBgBtn'),
        downloadBtn: document.getElementById('downloadBtn')
      };

      /* ==========================================================================
         4. GT7スペック表示制御（モバイル環境の確実な自動フェードアウト）
         ========================================================================== */
      let specFadeTimer = null;

      const hideSpecOverlay = () => {
        DOM.gtSpecOverlay.classList.add('is-hidden');
      };

      const showSpecOverlay = () => {
        DOM.gtSpecOverlay.classList.remove('is-hidden');
      };

      // モバイル環境：開始3.5秒後に自動でふわっと消去
      if (STATE.isMobile) {
        specFadeTimer = setTimeout(() => {
          hideSpecOverlay();
        }, 3500);
      }

      // 「ℹ️ SPEC」ボタンによるトグル切替
      DOM.gtToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (DOM.gtSpecOverlay.classList.contains('is-hidden')) {
          showSpecOverlay();
          if (specFadeTimer) clearTimeout(specFadeTimer);
          // 再表示後、4秒経過で再び自動消去
          specFadeTimer = setTimeout(hideSpecOverlay, 4000);
        } else {
          hideSpecOverlay();
        }
      });

      /* ==========================================================================
         5. 3Dビューワー・カメラ・マテリアル制御
         ========================================================================== */
      const updateCameraTarget = () => {
        const { x, y, z } = STATE.position;
        DOM.viewer.cameraTarget = `${x.toFixed(2)}m ${y.toFixed(2)}m ${z.toFixed(2)}m`;
      };

      const configureSceneNodes = (isMeshMode) => {
        const symbols = Object.getOwnPropertySymbols(DOM.viewer);
        const sceneSymbol = symbols.find(s => s.description === 'scene') || Symbol.for('scene');
        const scene = DOM.viewer[sceneSymbol];

        if (scene) {
          scene.traverse((node) => {
            if (node.isMesh) {
              node.frustumCulled = false;
              if (node.material) {
                if (Array.isArray(node.material)) {
                  node.material.forEach(m => { m.wireframe = isMeshMode; });
                } else {
                  node.material.wireframe = isMeshMode;
                }
              }
            }
          });
        }
      };

      const cacheOriginalMaterials = () => {
        if (!DOM.viewer.model) return;
        STATE.originalMaterials = DOM.viewer.model.materials.map(mat => ({
          baseColorFactor: [...mat.pbrMetallicRoughness.baseColorFactor],
          baseColorTexture: mat.pbrMetallicRoughness.baseColorTexture.texture,
          roughnessFactor: mat.pbrMetallicRoughness.roughnessFactor,
          metallicFactor: mat.pbrMetallicRoughness.metallicFactor,
          emissiveFactor: [...mat.emissiveFactor],
          alphaMode: mat.alphaMode
        }));
      };

      const applyViewMode = (mode) => {
        STATE.currentMode = mode;
        if (!DOM.viewer.model) return;

        configureSceneNodes(mode === 'mesh');
        const materials = DOM.viewer.model.materials;

        materials.forEach((mat, idx) => {
          const orig = STATE.originalMaterials[idx];

          switch (mode) {
            case 'normal':
              if (orig) {
                mat.pbrMetallicRoughness.setBaseColorFactor(orig.baseColorFactor);
                mat.pbrMetallicRoughness.baseColorTexture.setTexture(orig.baseColorTexture);
                mat.pbrMetallicRoughness.setRoughnessFactor(orig.roughnessFactor);
                mat.pbrMetallicRoughness.setMetallicFactor(orig.metallicFactor);
                mat.setEmissiveFactor(orig.emissiveFactor);
                mat.setAlphaMode(orig.alphaMode);
              }
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;

            case 'solid':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.85, 0.85, 0.85, 1.0]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.5);
              mat.pbrMetallicRoughness.setMetallicFactor(0.1);
              mat.setEmissiveFactor([0, 0, 0]);
              mat.setAlphaMode('OPAQUE');
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;

            case 'hologram':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 0.8, 1.0, 0.5]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.2);
              mat.pbrMetallicRoughness.setMetallicFactor(0.8);
              mat.setEmissiveFactor([0.0, 0.6, 1.0]);
              mat.setAlphaMode('BLEND');
              DOM.holoOverlay.classList.add('active');
              DOM.viewer.style.filter = 'drop-shadow(0 0 15px rgba(0, 229, 255, 0.75))';
              break;

            case 'mesh':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 1.0, 0.5, 1.0]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.1);
              mat.pbrMetallicRoughness.setMetallicFactor(0.1);
              mat.setEmissiveFactor([0.0, 0.8, 0.4]);
              mat.setAlphaMode('OPAQUE');
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;
          }
        });
      };

      /** ポリゴン精度切替 ＆ スペック表ポリゴン値のリアルタイム同期 */
      const selectModelIndex = (index) => {
        if (DOM.modelButtons[index]) {
          DOM.modelButtons.forEach(btn => btn.classList.remove('active'));
          DOM.modelButtons[index].classList.add('active');
          DOM.viewer.src = DOM.modelButtons[index].getAttribute('data-src');

          const polyCount = DOM.modelButtons[index].getAttribute('data-poly');
          if (polyCount) {
            DOM.specPolyVal.innerHTML = `${polyCount}<span>Tris</span>`;
          }
        }
      };

      const selectMode = (mode) => {
        DOM.modeButtons.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
        });
        applyViewMode(mode);
      };

      const startFastRotate = () => {
        STATE.isFastRotating = true;
        DOM.viewer.setAttribute('auto-rotate', '');
        DOM.viewer.setAttribute('rotation-per-second', CONFIG.FAST_ROTATION_SPEED);
        DOM.fastRotateBtn.classList.add('fast-active');
        DOM.toggleRotateBtn.classList.add('active');
      };

      const stopFastRotate = () => {
        STATE.isFastRotating = false;
        DOM.viewer.setAttribute('rotation-per-second', CONFIG.NORMAL_ROTATION_SPEED);
        DOM.fastRotateBtn.classList.remove('fast-active');
      };

      const setScaleValue = (val) => {
        const clamped = Math.min(Math.max(val, 0.1), 1.5);
        DOM.scaleSlider.value = clamped;
        DOM.viewer.scale = `${clamped} ${clamped} ${clamped}`;
      };

      const startCamera = async () => {
        try {
          STATE.cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          DOM.cameraVideo.srcObject = STATE.cameraStream;
          DOM.cameraVideo.style.display = 'block';
          document.body.style.backgroundColor = 'transparent';
          document.body.style.backgroundImage = 'none';
          DOM.cameraBtn.classList.add('active');
          STATE.isCameraActive = true;
        } catch (err) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (STATE.cameraStream) {
          STATE.cameraStream.getTracks().forEach(track => track.stop());
          STATE.cameraStream = null;
        }
        DOM.cameraVideo.style.display = 'none';
        document.body.style.backgroundColor = DOM.bgColorPicker.value;
        DOM.cameraBtn.classList.remove('active');
        STATE.isCameraActive = false;
      };

      const resetAll = () => {
        stopCamera();
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = CONFIG.DEFAULT_BG_COLOR;
        DOM.bgColorPicker.value = CONFIG.DEFAULT_BG_COLOR;
        DOM.bgImgInput.value = '';

        setScaleValue(CONFIG.DEFAULT_SCALE);

        STATE.position = { x: 0, y: 0, z: 0 };
        DOM.viewer.cameraTarget = 'auto auto auto';

        stopFastRotate();
        DOM.viewer.setAttribute('auto-rotate', '');
        DOM.toggleRotateBtn.classList.add('active');
        DOM.viewer.cameraOrbit = '90deg 75deg auto';

        selectMode('normal');
      };

      const downloadCurrentModel = () => {
        const currentSrc = DOM.viewer.src;
        if (!currentSrc) return;
        const fileName = currentSrc.split('/').pop();
        const a = document.createElement('a');
        a.href = currentSrc;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      /* ==========================================================================
         6. イベントリスナー登録
         ========================================================================== */
      DOM.viewer.addEventListener('load', () => {
        cacheOriginalMaterials();
        applyViewMode(STATE.currentMode);
      });

      DOM.modelButtons.forEach((btn, idx) => {
        btn.addEventListener('click', () => selectModelIndex(idx));
      });

      DOM.modeButtons.forEach((btn) => {
        btn.addEventListener('click', () => selectMode(btn.getAttribute('data-mode')));
      });

      DOM.toggleRotateBtn.addEventListener('click', () => {
        if (DOM.viewer.hasAttribute('auto-rotate')) {
          DOM.viewer.removeAttribute('auto-rotate');
          DOM.toggleRotateBtn.classList.remove('active');
          if (STATE.isFastRotating) stopFastRotate();
        } else {
          DOM.viewer.setAttribute('auto-rotate', '');
          DOM.toggleRotateBtn.classList.add('active');
        }
      });

      DOM.fastRotateBtn.addEventListener('click', () => {
        if (STATE.isFastRotating) stopFastRotate();
        else startFastRotate();
      });

      DOM.scaleSlider.addEventListener('input', (e) => {
        setScaleValue(parseFloat(e.target.value));
      });

      DOM.cameraBtn.addEventListener('click', async () => {
        if (STATE.isCameraActive) stopCamera();
        else await startCamera();
      });

      DOM.bgColorPicker.addEventListener('input', (e) => {
        stopCamera();
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = e.target.value;
      });

      DOM.bgImgInput.addEventListener('change', (e) => {
        stopCamera();
        const file = e.target.files[0];
        if (file) {
          const imageUrl = URL.createObjectURL(file);
          document.body.style.backgroundImage = `url("${imageUrl}")`;
        }
      });

      DOM.resetBgBtn.addEventListener('click', resetAll);
      DOM.downloadBtn.addEventListener('click', downloadCurrentModel);

      /* ==========================================================================
         7. シークレット・キーボードショートカット
         ========================================================================== */
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        const key = e.key.toLowerCase();
        const orbit = DOM.viewer.getCameraOrbit();
        const theta = orbit ? orbit.theta : Math.PI / 2;

        if (key === 'w') {
          STATE.position.x += Math.sin(theta) * CONFIG.MOVE_STEP;
          STATE.position.z += Math.cos(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (key === 's') {
          STATE.position.x -= Math.sin(theta) * CONFIG.MOVE_STEP;
          STATE.position.z -= Math.cos(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (key === 'a') {
          STATE.position.x += Math.cos(theta) * CONFIG.MOVE_STEP;
          STATE.position.z -= Math.sin(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (key === 'd') {
          STATE.position.x -= Math.cos(theta) * CONFIG.MOVE_STEP;
          STATE.position.z += Math.sin(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }

        if (e.key === 'ArrowUp') {
          STATE.position.y -= CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (e.key === 'ArrowDown') {
          STATE.position.y += CONFIG.MOVE_STEP;
          updateCameraTarget();
        }

        if (key === '1') selectModelIndex(0);
        if (key === '2') selectModelIndex(1);
        if (key === '3') selectModelIndex(2);

        if (key === 'n') selectMode('normal');
        if (key === 'r') selectMode('solid');
        if (key === 'h') selectMode('hologram');
        if (key === 'm') selectMode('mesh');

        if (key === 'l') DOM.toggleRotateBtn.click();
        if (key === 'c') DOM.fastRotateBtn.click();

        if (key === '+' || key === '=') setScaleValue(parseFloat(DOM.scaleSlider.value) + 0.05);
        if (key === '-' || key === '_') setScaleValue(parseFloat(DOM.scaleSlider.value) - 0.05);

        if (key === 'b') DOM.bgColorPicker.click();
        if (key === 'p') DOM.bgImgInput.click();
        if (key === 'q') resetAll();
      });

    })();
  </script>
</body>
</html>
