<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村瀨亮介 3D Model Preview</title>
  <!-- Google model-viewer 読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #1a1a1a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* 上部モデル切り替えUI */
    .controls-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(30, 30, 30, 0.8);
      padding: 6px 8px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .btn {
      background: transparent;
      color: #aaa;
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn.active {
      color: #fff;
      background: #2563eb;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <!-- 切り替えボタン -->
  <div class="controls-panel">
    <button class="btn" data-src="./murase_statue_bust_500p_low.glb">500p (Low)</button>
    <button class="btn active" data-src="./murase_statue_bust_15k_standard.glb">15k (Standard)</button>
    <button class="btn" data-src="./murase_statue_bust_70k_raw.glb">70k (High)</button>
  </div>

  <!-- 3Dビューワー -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <!-- スクリプト制御 -->
  <script>
    const viewer = document.getElementById('viewer');
    const buttons = document.querySelectorAll('.btn');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // アクティブ表示の切り替え
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // モデルの切り替え
        const newSrc = btn.getAttribute('data-src');
        viewer.src = newSrc;
      });
    });
  </script>
</body>
</html>
