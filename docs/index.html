<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村瀨亮介 3D Model Preview</title>
  <!-- Google model-viewer 読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #666666; /* 既定の背景色 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    /* カメラ映像バックグラウンド用 */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    model-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      transition: filter 0.3s ease;
      z-index: 1;
    }

    /* ホログラムモード時の走査線オーバーレイ */
    .holo-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 240, 255, 0.08) 0px,
        rgba(0, 240, 255, 0.08) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
    }
    .holo-overlay.active {
      opacity: 1;
    }

    /* 下部コントロールパネル（レスポンシブ対応） */
    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      width: calc(100% - 24px);
      max-width: 960px;
      background: rgba(20, 20, 20, 0.85);
      padding: 10px 14px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .divider {
      width: 1px;
      height: 18px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .btn {
      background: transparent;
      color: #ccc;
      border: none;
      padding: 5px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .btn.active {
      color: #fff;
      background: #2563eb;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* 高速回転ボタンアクティブ時 */
    .btn.fast-active {
      color: #fff;
      background: #e11d48;
      font-weight: 600;
      box-shadow: 0 2px 12px rgba(225, 29, 72, 0.6);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* スライダー調整 */
    .scale-label {
      color: #ccc;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .scale-slider {
      width: 60px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    /* カラーピッカーの装飾 */
    .color-picker-label {
      position: relative;
      overflow: hidden;
    }

    .color-picker-label input[type="color"] {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    /* モバイル向け最適化 */
    @media (max-width: 520px) {
      .controls-panel {
        bottom: 10px;
        padding: 8px;
        gap: 5px;
        border-radius: 16px;
      }
      .divider {
        display: none;
      }
      .btn {
        padding: 4px 7px;
        font-size: 10px;
      }
      .scale-slider {
        width: 50px;
      }
    }
  </style>
</head>
<body>

  <!-- リアカメラ映像要素 -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <!-- ホログラム効果用エフェクトレイヤー -->
  <div id="holoOverlay" class="holo-overlay"></div>

  <!-- コントロールパネル -->
  <div class="controls-panel">
    <!-- 1. ポリゴン数切替 -->
    <div class="group">
      <button class="btn" data-src="./murase_statue_bust_500p_low.glb">500p</button>
      <button class="btn active" data-src="./murase_statue_bust_15k_standard.glb">15k</button>
      <button class="btn" data-src="./murase_statue_bust_70k_raw.glb">70k</button>
    </div>

    <div class="divider"></div>

    <!-- 2. 表示モード切替 -->
    <div class="group" id="viewModeGroup">
      <button class="btn active" data-mode="normal">標準</button>
      <button class="btn" data-mode="solid">ソリッド</button>
      <button class="btn" data-mode="hologram">ホログラム</button>
      <button class="btn" data-mode="mesh">メッシュ</button>
    </div>

    <div class="divider"></div>

    <!-- 3. 回転コントロール -->
    <div class="group">
      <button class="btn active" id="toggleRotateBtn" title="自動回転のON/OFF">🔄 回転</button>
      <button class="btn" id="fastRotateBtn" title="高速回転">🎠</button>
    </div>

    <div class="divider"></div>

    <!-- 4. モデルサイズ調整 -->
    <div class="group">
      <label class="scale-label">
        📏
        <input type="range" id="scaleSlider" class="scale-slider" min="0.1" max="1.5" step="0.05" value="0.5">
      </label>
    </div>

    <div class="divider"></div>

    <!-- 5. 背景カスタマイズ（カメラ機能追加） -->
    <div class="group">
      <button class="btn" id="cameraBtn" title="カメラ背景を取り込む">📷</button>

      <label class="btn color-picker-label" title="背景色を変更">
        🎨
        <input type="color" id="bgColorPicker" value="#666666">
      </label>

      <label class="btn" title="背景画像を読み込む">
        🖼️
        <input type="file" id="bgImgInput" accept="image/*">
      </label>

      <button class="btn" id="resetBgBtn" title="既定の状態に戻す">↺</button>
    </div>
  </div>

  <!-- 3Dビューワー (ar, ar-modes 属性を追加してApple Quick Look/WebXR対応) -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    scale="0.5 0.5 0.5"
    camera-orbit="90deg 75deg auto"
    auto-rotate 
    rotation-per-second="30deg"
    camera-controls 
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look">
  </model-viewer>

  <!-- スクリプト制御 -->
  <script>
    const viewer = document.getElementById('viewer');
    const modelButtons = document.querySelectorAll('.controls-panel .group:first-child .btn');
    const modeButtons = document.querySelectorAll('#viewModeGroup .btn');
    const holoOverlay = document.getElementById('holoOverlay');
    const toggleRotateBtn = document.getElementById('toggleRotateBtn');
    const fastRotateBtn = document.getElementById('fastRotateBtn');
    const scaleSlider = document.getElementById('scaleSlider');
    const cameraBtn = document.getElementById('cameraBtn');
    const cameraVideo = document.getElementById('cameraVideo');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const bgImgInput = document.getElementById('bgImgInput');
    const resetBgBtn = document.getElementById('resetBgBtn');

    const DEFAULT_SCALE = 0.5;
    const NORMAL_SPEED = '30deg';
    const FAST_SPEED = '1440deg';

    let currentMode = 'normal';
    let isFastRotating = false;
    let cameraStream = null;
    let isCameraActive = false;
    let originalMaterials = [];

    // ワイヤーフレーム表示のON/OFF制御
    function setWireframe(enable) {
      const symbols = Object.getOwnPropertySymbols(viewer);
      const sceneSymbol = symbols.find(s => s.description === 'scene') || Symbol.for('scene');
      const scene = viewer[sceneSymbol];
      if (scene) {
        scene.traverse((node) => {
          if (node.isMesh && node.material) {
            if (Array.isArray(node.material)) {
              node.material.forEach(m => { m.wireframe = enable; });
            } else {
              node.material.wireframe = enable;
            }
          }
        });
      }
    }

    // 元のマテリアル状態を保存
    function cacheOriginalMaterials() {
      if (!viewer.model) return;
      originalMaterials = viewer.model.materials.map(mat => {
        return {
          baseColorFactor: [...mat.pbrMetallicRoughness.baseColorFactor],
          baseColorTexture: mat.pbrMetallicRoughness.baseColorTexture.texture,
          roughnessFactor: mat.pbrMetallicRoughness.roughnessFactor,
          metallicFactor: mat.pbrMetallicRoughness.metallicFactor,
          emissiveFactor: [...mat.emissiveFactor],
          alphaMode: mat.alphaMode
        };
      });
    }

    // 表示モードの切り替え実行
    function applyViewMode(mode) {
      currentMode = mode;
      if (!viewer.model) return;

      setWireframe(mode === 'mesh');

      const materials = viewer.model.materials;

      materials.forEach((mat, idx) => {
        const orig = originalMaterials[idx];

        if (mode === 'normal') {
          if (orig) {
            mat.pbrMetallicRoughness.setBaseColorFactor(orig.baseColorFactor);
            mat.pbrMetallicRoughness.baseColorTexture.setTexture(orig.baseColorTexture);
            mat.pbrMetallicRoughness.setRoughnessFactor(orig.roughnessFactor);
            mat.pbrMetallicRoughness.setMetallicFactor(orig.metallicFactor);
            mat.setEmissiveFactor(orig.emissiveFactor);
            mat.setAlphaMode(orig.alphaMode);
          }
          holoOverlay.classList.remove('active');
          viewer.style.filter = 'none';

        } else if (mode === 'solid') {
          mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
          mat.pbrMetallicRoughness.setBaseColorFactor([0.85, 0.85, 0.85, 1.0]);
          mat.pbrMetallicRoughness.setRoughnessFactor(0.5);
          mat.pbrMetallicRoughness.setMetallicFactor(0.1);
          mat.setEmissiveFactor([0, 0, 0]);
          mat.setAlphaMode('OPAQUE');
          holoOverlay.classList.remove('active');
          viewer.style.filter = 'none';

        } else if (mode === 'hologram') {
          mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
          mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 0.8, 1.0, 0.5]);
          mat.pbrMetallicRoughness.setRoughnessFactor(0.2);
          mat.pbrMetallicRoughness.setMetallicFactor(0.8);
          mat.setEmissiveFactor([0.0, 0.6, 1.0]);
          mat.setAlphaMode('BLEND');
          holoOverlay.classList.add('active');
          viewer.style.filter = 'drop-shadow(0 0 15px rgba(0, 229, 255, 0.75))';

        } else if (mode === 'mesh') {
          mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
          mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 1.0, 0.5, 1.0]);
          mat.pbrMetallicRoughness.setRoughnessFactor(0.1);
          mat.pbrMetallicRoughness.setMetallicFactor(0.1);
          mat.setEmissiveFactor([0.0, 0.8, 0.4]);
          mat.setAlphaMode('OPAQUE');
          holoOverlay.classList.remove('active');
          viewer.style.filter = 'none';
        }
      });
    }

    viewer.addEventListener('load', () => {
      cacheOriginalMaterials();
      applyViewMode(currentMode);
    });

    // 1. ポリゴン数切替
    modelButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modelButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        viewer.src = btn.getAttribute('data-src');
      });
    });

    // 2. 表示モード切替
    modeButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modeButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyViewMode(btn.getAttribute('data-mode'));
      });
    });

    // 3. 通常回転トグル
    toggleRotateBtn.addEventListener('click', () => {
      if (viewer.hasAttribute('auto-rotate')) {
        viewer.removeAttribute('auto-rotate');
        toggleRotateBtn.classList.remove('active');
        if (isFastRotating) stopFastRotate();
      } else {
        viewer.setAttribute('auto-rotate', '');
        toggleRotateBtn.classList.add('active');
      }
    });

    // 4. 高速回転トグル（🎠）
    fastRotateBtn.addEventListener('click', () => {
      if (isFastRotating) {
        stopFastRotate();
      } else {
        startFastRotate();
      }
    });

    function startFastRotate() {
      isFastRotating = true;
      viewer.setAttribute('auto-rotate', '');
      viewer.setAttribute('rotation-per-second', FAST_SPEED);
      fastRotateBtn.classList.add('fast-active');
      toggleRotateBtn.classList.add('active');
    }

    function stopFastRotate() {
      isFastRotating = false;
      viewer.setAttribute('rotation-per-second', NORMAL_SPEED);
      fastRotateBtn.classList.remove('fast-active');
    }

    // 5. サイズ調整
    scaleSlider.addEventListener('input', (e) => {
      const scale = e.target.value;
      viewer.scale = `${scale} ${scale} ${scale}`;
    });

    // 6. リアカメラ背景のオン/オフ処理
    cameraBtn.addEventListener('click', async () => {
      if (isCameraActive) {
        stopCamera();
      } else {
        await startCamera();
      }
    });

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraVideo.style.display = 'block';
        document.body.style.backgroundColor = 'transparent';
        document.body.style.backgroundImage = 'none';
        cameraBtn.classList.add('active');
        isCameraActive = true;
      } catch (err) {
        alert('カメラの起動に失敗しました。アクセス権限を確認してください。');
        console.error(err);
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      cameraVideo.style.display = 'none';
      document.body.style.backgroundColor = bgColorPicker.value;
      cameraBtn.classList.remove('active');
      isCameraActive = false;
    }

    // 7. 背景色変更
    bgColorPicker.addEventListener('input', (e) => {
      stopCamera();
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = e.target.value;
    });

    // 8. 背景画像読み込み
    bgImgInput.addEventListener('change', (e) => {
      stopCamera();
      const file = e.target.files[0];
      if (file) {
        const imageUrl = URL.createObjectURL(file);
        document.body.style.backgroundImage = `url("${imageUrl}")`;
      }
    });

    // 9. リセット
    resetBgBtn.addEventListener('click', () => {
      stopCamera();
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = '#666666';
      bgColorPicker.value = '#666666';
      bgImgInput.value = '';

      scaleSlider.value = DEFAULT_SCALE;
      viewer.scale = `${DEFAULT_SCALE} ${DEFAULT_SCALE} ${DEFAULT_SCALE}`;

      stopFastRotate();
      viewer.setAttribute('auto-rotate', '');
      toggleRotateBtn.classList.add('active');
      viewer.cameraOrbit = '90deg 75deg auto';

      modeButtons.forEach(b => b.classList.remove('active'));
      modeButtons[0].classList.add('active');
      applyViewMode('normal');
    });
  </script>
</body>
</html>
