<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>村瀨亮介 3D Model Preview</title>

  <!-- ファビコン設定 -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

  <!-- Google model-viewer モジュール読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* ==========================================================================
       1. デザインシステム & CSS変数定義
       ========================================================================== */
    :root {
      /* ベースカラー */
      --bg-default: #666666;
      --surface-dark: rgba(15, 18, 24, 0.85);
      --surface-sub: rgba(22, 26, 34, 0.94);

      /* GT1風 ウォームレーシングオレンジ (アクセント) */
      --gt-orange: #ff7700;
      --gt-orange-hover: #e66a00;
      --gt-orange-border: #ff9433;
      --gt-orange-glow: rgba(255, 119, 0, 0.65);
      --gt-orange-subtle: rgba(255, 119, 0, 0.25);

      /* ステータス・特殊カラー */
      --accent-red: #e11d48;
      --accent-red-border: #f43f5e;
      --accent-red-glow: rgba(225, 29, 72, 0.8);
      --gt-green: #34d399;

      /* テキスト・ボーダーカラー */
      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: rgba(255, 255, 255, 0.55);
      --border-light: rgba(255, 255, 255, 0.2);
      --border-subtle: rgba(255, 255, 255, 0.12);

      /* アニメーション・トランジション */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: 0.2s var(--ease-out-expo);
      --transition-smooth: 0.4s var(--ease-out-expo);
      --transition-slow: 1s var(--ease-out-expo);
    }

    /* ==========================================================================
       2. リセット & ベースレイアウト
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-default);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.3s ease;
    }

    /* 背景用リアカメラ映像レイヤー */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* 3Dビューワーキャンバス */
    model-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      transition: filter 0.3s ease;
      z-index: 1;
    }

    /* ホログラムモード用 走査線エフェクトオーバーレイ */
    .holo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 240, 255, 0.08) 0px,
        rgba(0, 240, 255, 0.08) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    .holo-overlay.active {
      opacity: 1;
    }

    /* AR起動フローティングボタン (右上) */
    .ar-fab-btn {
      position: absolute;
      top: 20px;
      right: 16px;
      z-index: 100;
      background: var(--gt-orange);
      color: var(--text-main);
      border: 1px solid var(--gt-orange-border);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px var(--gt-orange-glow);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .ar-fab-btn:active {
      transform: scale(0.95);
      background: var(--gt-orange-hover);
    }

    /* ==========================================================================
       3. フォーミュラ風 スペックオーバーレイ (左上)
       ========================================================================== */
    .gt-spec-overlay {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 20;
      max-width: 320px;
      color: var(--text-main);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      opacity: 1;
      transform: translateX(0);
      transition: opacity var(--transition-slow), transform var(--transition-slow);
      pointer-events: auto;
    }

    .gt-spec-overlay.is-hidden {
      opacity: 0 !important;
      transform: translateX(-24px) !important;
      pointer-events: none !important;
    }

    .gt-formula-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--text-main);
      background: var(--gt-orange-subtle);
      border: 1px solid var(--gt-orange);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      box-shadow: 0 0 10px rgba(255, 119, 0, 0.4);
    }

    .gt-country {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2px;
      letter-spacing: 0.05em;
    }

    .gt-name-main {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: var(--text-main);
    }

    .gt-name-sub {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    .gt-pp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0 10px;
      padding: 2px 10px;
      border: 1px solid var(--gt-orange);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: rgba(0, 0, 0, 0.4);
      color: var(--text-main);
    }

    .gt-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
      margin-bottom: 10px;
    }

    .gt-spec-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .gt-spec-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .gt-spec-label {
      width: 68px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .gt-spec-val {
      font-weight: 600;
      color: var(--text-main);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .gt-spec-val span {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      margin-left: 2px;
    }

    .gt-status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .gt-status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .gt-status-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.5);
    }

    .gt-status-icon {
      font-size: 11px;
    }

    .gt-status-text {
      font-size: 9px;
      font-weight: 700;
      color: var(--gt-green);
      letter-spacing: 0.04em;
    }

    /* モバイル用 スペック再表示トグルボタン */
    .gt-mobile-toggle-btn {
      position: absolute;
      top: 18px;
      left: 16px;
      z-index: 25;
      background: var(--surface-dark);
      color: var(--text-main);
      border: 1px solid var(--gt-orange);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
      box-shadow: 0 0 10px rgba(255, 119, 0, 0.3);
    }

    /* ==========================================================================
       4. 通知テキスト演出 (最前面・字幕スタイル)
       ========================================================================== */
    .gt-toast {
      position: fixed;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--transition-smooth), transform var(--transition-smooth);
      z-index: 100;
      white-space: nowrap;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .gt-toast::after {
      content: '▼';
      font-size: 9px;
      opacity: 0.7;
      transform: scaleX(1.3);
    }

    .gt-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       5. ガレージ下部メニューバー & サブメニュー
       ========================================================================== */
    .gt-garage-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      background: linear-gradient(
        180deg,
        transparent 0%,
        rgba(10, 12, 16, 0.5) 15%,
        rgba(6, 8, 12, 0.9) 50%,
        rgba(2, 3, 5, 0.98) 100%
      );
      padding-top: 24px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* サブメニューバー */
    .gt-sub-bar {
      margin-bottom: 12px;
      background: var(--surface-sub);
      border: 1px solid var(--border-light);
      border-radius: 20px;
      padding: 6px 8px;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      max-width: calc(100vw - 24px);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      animation: subMenuPop 0.25s var(--ease-out-expo) forwards;
    }

    .gt-sub-bar::-webkit-scrollbar {
      display: none;
    }

    .gt-sub-bar.active {
      display: inline-flex;
    }

    @keyframes subMenuPop {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gt-sub-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: 1px solid var(--border-subtle);
      padding: 7px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .gt-sub-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--text-main);
    }

    .gt-sub-btn.active {
      background: var(--gt-orange);
      border-color: var(--gt-orange-border);
      color: var(--text-main);
      box-shadow: 0 0 14px var(--gt-orange-glow);
    }

    .gt-sub-btn.fast-active {
      background: var(--accent-red);
      border-color: var(--accent-red-border);
      color: var(--text-main);
      box-shadow: 0 0 16px var(--accent-red-glow);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .gt-sub-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      padding-left: 4px;
    }

    /* カラーピッカー用透明オーバーレイ入力 */
    .gt-color-picker-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
    }

    /* スケール調整スライダー */
    .gt-slider {
      width: 110px;
      height: 20px;
      accent-color: var(--gt-orange);
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    /* メインアイコンメニューリスト */
    .gt-main-menu {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 960px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .gt-main-menu::-webkit-scrollbar {
      display: none;
    }

    .gt-menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
      transition: all var(--transition-fast);
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gt-menu-item:hover,
    .gt-menu-item.active {
      color: var(--text-main);
      transform: translateY(-2px);
    }

    .gt-menu-item:active {
      transform: scale(0.94);
    }

    .gt-menu-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gt-menu-icon svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all var(--transition-fast);
    }

    .gt-menu-item.active .gt-menu-icon svg {
      stroke: var(--gt-orange);
      filter: drop-shadow(0 0 8px var(--gt-orange-glow));
    }

    .gt-menu-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ==========================================================================
       6. モバイル向けレスポンシブ最適化
       ========================================================================== */
    @media (max-width: 640px) {
      .gt-spec-overlay {
        top: 60px;
        left: 20px;
        max-width: 280px;
      }

      .gt-mobile-toggle-btn {
        display: inline-flex;
      }

      .gt-main-menu {
        justify-content: flex-start;
        gap: 14px;
      }

      .gt-menu-label {
        font-size: 10px;
      }

      .gt-toast {
        bottom: calc(145px + env(safe-area-inset-bottom, 0px));
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- 背景用リアカメラ映像要素 -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <!-- ホログラムモード用 走査線オーバーレイ -->
  <div id="holoOverlay" class="holo-overlay"></div>

  <!-- モバイル用 スペック再表示ボタン -->
  <button id="gtToggleBtn" class="gt-mobile-toggle-btn">
    ℹ️ SPEC
  </button>

  <!-- 通知トーストテキスト -->
  <div id="gtToast" class="gt-toast">モデルを切り替えました</div>

  <!-- ==========================================================================
       フォーミュラ風 スペックオーバーレイ (左上)
       ========================================================================== -->
  <div id="gtSpecOverlay" class="gt-spec-overlay">
    <div class="gt-formula-badge">FORMULA SPEC</div>

    <div class="gt-country">
      <span>🇯🇵</span>
      <span>北海道 旭川 / ASAHIKAWA HOKKAIDO</span>
    </div>

    <div class="gt-name-main">村瀨亮介 '96</div>
    <div class="gt-name-sub">Ryosuke MURASE / Single-Seater Humanoid</div>

    <div class="gt-pp-badge">PP 596.24</div>

    <div class="gt-divider"></div>

    <div class="gt-spec-list">
      <div class="gt-spec-row">
        <span class="gt-spec-label">本体乾燥重量</span>
        <span class="gt-spec-val">87<span>kg</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">全高 (身長)</span>
        <span class="gt-spec-val">172<span>cm</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">駆動方式</span>
        <span class="gt-spec-val">MR<span>(ミッドシップ 2WD)</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">主要燃料</span>
        <span class="gt-spec-val">カレー<span>(Curry & Spices)</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">総ポリゴン</span>
        <span class="gt-spec-val" id="specPolyVal">15,000<span>Tris</span></span>
      </div>
    </div>

    <div class="gt-status-row">
      <div class="gt-status-item">
        <span class="gt-status-tag">PU</span>
        <span class="gt-status-icon">⚙️</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">CHASSIS</span>
        <span class="gt-status-icon">🛡️</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">ENERGY</span>
        <span class="gt-status-icon">⚡</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">SYSTEM</span>
        <span class="gt-status-icon">🟢</span>
        <span class="gt-status-text">良好</span>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       3Dモデルビューワー本体
       ========================================================================== -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    scale="0.5 0.5 0.5"
    camera-orbit="90deg 75deg auto"
    camera-target="0m 0m 0m"
    auto-rotate 
    rotation-per-second="30deg"
    camera-controls 
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <button slot="ar-button" class="ar-fab-btn">
      👓 AR表示
    </button>
  </model-viewer>

  <!-- ==========================================================================
       ガレージ下部メニューバー & サブメニュー群
       ========================================================================== -->
  <div class="gt-garage-bottom">

    <!-- サブメニュー 1: モデル精度切替 -->
    <div id="subSwitch" class="gt-sub-bar">
      <button class="gt-sub-btn" data-src="./murase_statue_bust_500p_low.glb" data-poly="500">500p Low</button>
      <button class="gt-sub-btn active" data-src="./murase_statue_bust_15k_standard.glb" data-poly="15,000">15k Standard</button>
      <button class="gt-sub-btn" data-src="./murase_statue_bust_70k_raw.glb" data-poly="70,000">70k Raw</button>
    </div>

    <!-- サブメニュー 2: セッティング (シェーディング切替) -->
    <div id="subSetting" class="gt-sub-bar">
      <button class="gt-sub-btn active" data-mode="normal">標準</button>
      <button class="gt-sub-btn" data-mode="solid">ソリッド</button>
      <button class="gt-sub-btn" data-mode="hologram">ホログラム</button>
      <button class="gt-sub-btn" data-mode="mesh">メッシュ</button>
    </div>

    <!-- サブメニュー 3: ビュー (回転制御) -->
    <div id="subView" class="gt-sub-bar">
      <button id="toggleRotateBtn" class="gt-sub-btn active">回転</button>
      <button id="fastRotateBtn" class="gt-sub-btn">🎠</button>
    </div>

    <!-- サブメニュー 4: スケープス (背景カスタマイズ) -->
    <div id="subScapes" class="gt-sub-bar">
      <button id="cameraBtn" class="gt-sub-btn">📷 カメラ背景</button>
      <label class="gt-sub-btn">
        🎨 背景色
        <input type="color" id="bgColorPicker" class="gt-color-picker-input" value="#666666">
      </label>
      <label class="gt-sub-btn">
        🖼️ 背景画像
        <input type="file" id="bgImgInput" accept="image/*">
      </label>
      <button id="resetBgBtn" class="gt-sub-btn">↺ 既定に戻す</button>
    </div>

    <!-- サブメニュー 5: ディテール (スケール調整) -->
    <div id="subScale" class="gt-sub-bar">
      <span class="gt-sub-label">スケール:</span>
      <input type="range" id="scaleSlider" class="gt-slider" min="0.1" max="1.5" step="0.05" value="0.5">
    </div>

    <!-- メインメニューアイコンバー -->
    <div class="gt-main-menu">
      <!-- 1. モデル (3Dキューブ) -->
      <button class="gt-menu-item" data-sub="subSwitch">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <span class="gt-menu-label">モデル</span>
      </button>

      <!-- 2. セッティング (レンチ) -->
      <button class="gt-menu-item" data-sub="subSetting">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <span class="gt-menu-label">セッティング</span>
      </button>

      <!-- 3. ビュー (360°回転) -->
      <button class="gt-menu-item" data-sub="subView">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </div>
        <span class="gt-menu-label">ビュー</span>
      </button>

      <!-- 4. スケープス (背景) -->
      <button class="gt-menu-item" data-sub="subScapes">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="m8 3 4 8 5-5 5 11H2L8 3z"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
        </div>
        <span class="gt-menu-label">スケープス</span>
      </button>

      <!-- 5. ディテール (ズーム) -->
      <button class="gt-menu-item" data-sub="subScale">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </div>
        <span class="gt-menu-label">ディテール</span>
      </button>

      <!-- 6. ギフト (モデルダウンロード) -->
      <button class="gt-menu-item" id="downloadBtn">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
        </div>
        <span class="gt-menu-label">ギフト (DL)</span>
      </button>

      <!-- 7. GitHub リポジトリリンク -->
      <a href="https://github.com/MuraseRyosuke/Murase-Ryosuke-3D-Model" target="_blank" rel="noopener noreferrer" class="gt-menu-item">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </div>
        <span class="gt-menu-label">GitHub</span>
      </a>
    </div>
  </div>

  <!-- ==========================================================================
       アプリケーション制御スクリプト
       ========================================================================== -->
  <script>
    (() => {
      'use strict';

      /* --------------------------------------------------------------------------
         1. 定数設定 (CONFIG)
         -------------------------------------------------------------------------- */
      const CONFIG = {
        DEFAULT_SCALE: 0.5,
        MIN_SCALE: 0.1,
        MAX_SCALE: 1.5,
        SCALE_STEP: 0.05,
        DEFAULT_BG_COLOR: '#666666',
        DEFAULT_ORBIT: '90deg 75deg auto',
        NORMAL_ROTATION_SPEED: '30deg',
        FAST_ROTATION_SPEED: '1440deg',
        MOVE_STEP: 0.05,
        TOAST_DURATION: 2200,
        SPEC_INITIAL_FADE_DELAY: 3500,
        SPEC_REOPEN_FADE_DELAY: 4000
      };

      /* --------------------------------------------------------------------------
         2. 状態管理 (STATE)
         -------------------------------------------------------------------------- */
      const isMobileDevice = window.innerWidth <= 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      const STATE = {
        currentMode: 'normal',
        isFastRotating: false,
        isCameraActive: false,
        cameraStream: null,
        originalMaterials: [],
        position: { x: 0, y: 0, z: 0 },
        isMobile: isMobileDevice,
        timers: {
          toast: null,
          specFade: null
        }
      };

      /* --------------------------------------------------------------------------
         3. DOM要素キャッシュ (DOM)
         -------------------------------------------------------------------------- */
      const DOM = {
        viewer: document.getElementById('viewer'),
        gtSpecOverlay: document.getElementById('gtSpecOverlay'),
        gtToggleBtn: document.getElementById('gtToggleBtn'),
        specPolyVal: document.getElementById('specPolyVal'),
        gtToast: document.getElementById('gtToast'),
        menuItems: document.querySelectorAll('.gt-menu-item[data-sub]'),
        subBars: document.querySelectorAll('.gt-sub-bar'),
        modelButtons: document.querySelectorAll('#subSwitch .gt-sub-btn'),
        modeButtons: document.querySelectorAll('#subSetting .gt-sub-btn'),
        holoOverlay: document.getElementById('holoOverlay'),
        toggleRotateBtn: document.getElementById('toggleRotateBtn'),
        fastRotateBtn: document.getElementById('fastRotateBtn'),
        scaleSlider: document.getElementById('scaleSlider'),
        cameraBtn: document.getElementById('cameraBtn'),
        cameraVideo: document.getElementById('cameraVideo'),
        bgColorPicker: document.getElementById('bgColorPicker'),
        bgImgInput: document.getElementById('bgImgInput'),
        resetBgBtn: document.getElementById('resetBgBtn'),
        downloadBtn: document.getElementById('downloadBtn')
      };

      /* --------------------------------------------------------------------------
         4. UI演出・オーバーレイ制御関数
         -------------------------------------------------------------------------- */

      /** 画面下部に字幕風の通知メッセージを表示 */
      const showToast = (message) => {
        DOM.gtToast.textContent = message;
        DOM.gtToast.classList.add('show');
        if (STATE.timers.toast) clearTimeout(STATE.timers.toast);
        STATE.timers.toast = setTimeout(() => {
          DOM.gtToast.classList.remove('show');
        }, CONFIG.TOAST_DURATION);
      };

      /** スペックオーバーレイの表示 / 非表示制御 */
      const hideSpecOverlay = () => DOM.gtSpecOverlay.classList.add('is-hidden');
      const showSpecOverlay = () => DOM.gtSpecOverlay.classList.remove('is-hidden');

      /* --------------------------------------------------------------------------
         5. 3Dシーン・マテリアル・カメラ制御関数
         -------------------------------------------------------------------------- */

      /** 3D空間上のカメラターゲット位置を更新 */
      const updateCameraTarget = () => {
        const { x, y, z } = STATE.position;
        DOM.viewer.cameraTarget = `${x.toFixed(2)}m ${y.toFixed(2)}m ${z.toFixed(2)}m`;
      };

      /** Three.js内部ノード走査（視界カリング無効化 & ワイヤーフレーム適用） */
      const configureSceneNodes = (isMeshMode) => {
        const symbols = Object.getOwnPropertySymbols(DOM.viewer);
        const sceneSymbol = symbols.find(s => s.description === 'scene') || Symbol.for('scene');
        const scene = DOM.viewer[sceneSymbol];

        if (!scene) return;
        scene.traverse((node) => {
          if (node.isMesh) {
            node.frustumCulled = false;
            if (node.material) {
              if (Array.isArray(node.material)) {
                node.material.forEach(m => { m.wireframe = isMeshMode; });
              } else {
                node.material.wireframe = isMeshMode;
              }
            }
          }
        });
      };

      /** モデルの初期マテリアル設定をキャッシュ */
      const cacheOriginalMaterials = () => {
        if (!DOM.viewer.model) return;
        STATE.originalMaterials = DOM.viewer.model.materials.map(mat => ({
          baseColorFactor: [...mat.pbrMetallicRoughness.baseColorFactor],
          baseColorTexture: mat.pbrMetallicRoughness.baseColorTexture.texture,
          roughnessFactor: mat.pbrMetallicRoughness.roughnessFactor,
          metallicFactor: mat.pbrMetallicRoughness.metallicFactor,
          emissiveFactor: [...mat.emissiveFactor],
          alphaMode: mat.alphaMode
        }));
      };

      /** 指定されたシェーディング表示モードをモデルに適用 */
      const applyViewMode = (mode) => {
        STATE.currentMode = mode;
        if (!DOM.viewer.model) return;

        configureSceneNodes(mode === 'mesh');
        const materials = DOM.viewer.model.materials;

        materials.forEach((mat, idx) => {
          const orig = STATE.originalMaterials[idx];

          switch (mode) {
            case 'normal':
              if (orig) {
                mat.pbrMetallicRoughness.setBaseColorFactor(orig.baseColorFactor);
                mat.pbrMetallicRoughness.baseColorTexture.setTexture(orig.baseColorTexture);
                mat.pbrMetallicRoughness.setRoughnessFactor(orig.roughnessFactor);
                mat.pbrMetallicRoughness.setMetallicFactor(orig.metallicFactor);
                mat.setEmissiveFactor(orig.emissiveFactor);
                mat.setAlphaMode(orig.alphaMode);
              }
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;

            case 'solid':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.85, 0.85, 0.85, 1.0]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.5);
              mat.pbrMetallicRoughness.setMetallicFactor(0.1);
              mat.setEmissiveFactor([0, 0, 0]);
              mat.setAlphaMode('OPAQUE');
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;

            case 'hologram':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 0.8, 1.0, 0.5]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.2);
              mat.pbrMetallicRoughness.setMetallicFactor(0.8);
              mat.setEmissiveFactor([0.0, 0.6, 1.0]);
              mat.setAlphaMode('BLEND');
              DOM.holoOverlay.classList.add('active');
              DOM.viewer.style.filter = 'drop-shadow(0 0 15px rgba(0, 229, 255, 0.75))';
              break;

            case 'mesh':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 1.0, 0.5, 1.0]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.1);
              mat.pbrMetallicRoughness.setMetallicFactor(0.1);
              mat.setEmissiveFactor([0.0, 0.8, 0.4]);
              mat.setAlphaMode('OPAQUE');
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;
          }
        });
      };

      /** モデル精度の切り替えとスペック表示の更新 */
      const selectModelIndex = (index) => {
        const targetBtn = DOM.modelButtons[index];
        if (!targetBtn) return;

        DOM.modelButtons.forEach(btn => btn.classList.remove('active'));
        targetBtn.classList.add('active');
        DOM.viewer.src = targetBtn.getAttribute('data-src');

        const polyCount = targetBtn.getAttribute('data-poly');
        if (polyCount) {
          DOM.specPolyVal.innerHTML = `${polyCount}<span>Tris</span>`;
        }
        showToast('モデルを切り替えました');
      };

      /** 表示モードの切り替えとUI状態の同期 */
      const selectMode = (mode) => {
        DOM.modeButtons.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
        });
        applyViewMode(mode);
        showToast('セッティングを適用しました');
      };

      /** 高速回転モードの開始 / 停止 */
      const startFastRotate = () => {
        STATE.isFastRotating = true;
        DOM.viewer.setAttribute('auto-rotate', '');
        DOM.viewer.setAttribute('rotation-per-second', CONFIG.FAST_ROTATION_SPEED);
        DOM.fastRotateBtn.classList.add('fast-active');
        DOM.toggleRotateBtn.classList.add('active');
      };

      const stopFastRotate = () => {
        STATE.isFastRotating = false;
        DOM.viewer.setAttribute('rotation-per-second', CONFIG.NORMAL_ROTATION_SPEED);
        DOM.fastRotateBtn.classList.remove('fast-active');
      };

      /** モデルのスケール（サイズ）変更 */
      const setScaleValue = (val) => {
        const clamped = Math.min(Math.max(val, CONFIG.MIN_SCALE), CONFIG.MAX_SCALE);
        DOM.scaleSlider.value = clamped;
        DOM.viewer.scale = `${clamped} ${clamped} ${clamped}`;
      };

      /** デバイスカメラ映像の背景パススルー開始 / 停止 */
      const startCamera = async () => {
        try {
          STATE.cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          DOM.cameraVideo.srcObject = STATE.cameraStream;
          DOM.cameraVideo.style.display = 'block';
          document.body.style.backgroundColor = 'transparent';
          document.body.style.backgroundImage = 'none';
          DOM.cameraBtn.classList.add('active');
          STATE.isCameraActive = true;
          showToast('カメラ背景を起動しました');
        } catch (err) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (STATE.cameraStream) {
          STATE.cameraStream.getTracks().forEach(track => track.stop());
          STATE.cameraStream = null;
        }
        DOM.cameraVideo.style.display = 'none';
        document.body.style.backgroundColor = DOM.bgColorPicker.value;
        DOM.cameraBtn.classList.remove('active');
        STATE.isCameraActive = false;
      };

      /** すべての設定を初期状態へリセット */
      const resetAll = () => {
        stopCamera();
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = CONFIG.DEFAULT_BG_COLOR;
        DOM.bgColorPicker.value = CONFIG.DEFAULT_BG_COLOR;
        DOM.bgImgInput.value = '';

        setScaleValue(CONFIG.DEFAULT_SCALE);

        STATE.position = { x: 0, y: 0, z: 0 };
        DOM.viewer.cameraTarget = 'auto auto auto';

        stopFastRotate();
        DOM.viewer.setAttribute('auto-rotate', '');
        DOM.toggleRotateBtn.classList.add('active');
        DOM.viewer.cameraOrbit = CONFIG.DEFAULT_ORBIT;

        selectMode('normal');
        showToast('設定をリセットしました');
      };

      /** 現在選択中の3Dモデル（.glb）をダウンロード */
      const downloadCurrentModel = () => {
        const currentSrc = DOM.viewer.src;
        if (!currentSrc) return;
        const fileName = currentSrc.split('/').pop();
        const a = document.createElement('a');
        a.href = currentSrc;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('ダウンロードを開始しました');
      };

      /* --------------------------------------------------------------------------
         6. イベントリスナーのセットアップ
         -------------------------------------------------------------------------- */

      // モバイル端末での初期スペック自動フェードアウト
      if (STATE.isMobile) {
        STATE.timers.specFade = setTimeout(hideSpecOverlay, CONFIG.SPEC_INITIAL_FADE_DELAY);
      }

      // モバイル用 SPECトグルボタン
      DOM.gtToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (DOM.gtSpecOverlay.classList.contains('is-hidden')) {
          showSpecOverlay();
          if (STATE.timers.specFade) clearTimeout(STATE.timers.specFade);
          STATE.timers.specFade = setTimeout(hideSpecOverlay, CONFIG.SPEC_REOPEN_FADE_DELAY);
        } else {
          hideSpecOverlay();
        }
      });

      // メインメニューからのサブメニュー開閉制御
      DOM.menuItems.forEach(item => {
        item.addEventListener('click', () => {
          const targetSubId = item.getAttribute('data-sub');
          const targetSub = document.getElementById(targetSubId);
          const isAlreadyActive = item.classList.contains('active') && targetSub && targetSub.classList.contains('active');

          DOM.menuItems.forEach(m => m.classList.remove('active'));
          DOM.subBars.forEach(s => s.classList.remove('active'));

          if (!isAlreadyActive && targetSub) {
            item.classList.add('active');
            targetSub.classList.add('active');
          }
        });
      });

      // モデルロード完了時の初期化
      DOM.viewer.addEventListener('load', () => {
        cacheOriginalMaterials();
        applyViewMode(STATE.currentMode);
      });

      // 各種コントロールボタンのイベントバインド
      DOM.modelButtons.forEach((btn, idx) => {
        btn.addEventListener('click', () => selectModelIndex(idx));
      });

      DOM.modeButtons.forEach((btn) => {
        btn.addEventListener('click', () => selectMode(btn.getAttribute('data-mode')));
      });

      DOM.toggleRotateBtn.addEventListener('click', () => {
        if (DOM.viewer.hasAttribute('auto-rotate')) {
          DOM.viewer.removeAttribute('auto-rotate');
          DOM.toggleRotateBtn.classList.remove('active');
          if (STATE.isFastRotating) stopFastRotate();
        } else {
          DOM.viewer.setAttribute('auto-rotate', '');
          DOM.toggleRotateBtn.classList.add('active');
        }
      });

      DOM.fastRotateBtn.addEventListener('click', () => {
        if (STATE.isFastRotating) stopFastRotate();
        else startFastRotate();
      });

      DOM.scaleSlider.addEventListener('input', (e) => {
        setScaleValue(parseFloat(e.target.value));
      });

      DOM.cameraBtn.addEventListener('click', async () => {
        if (STATE.isCameraActive) stopCamera();
        else await startCamera();
      });

      DOM.bgColorPicker.addEventListener('input', (e) => {
        stopCamera();
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = e.target.value;
      });

      DOM.bgImgInput.addEventListener('change', (e) => {
        stopCamera();
        const file = e.target.files[0];
        if (file) {
          const imageUrl = URL.createObjectURL(file);
          document.body.style.backgroundImage = `url("${imageUrl}")`;
          showToast('背景画像を設定しました');
        }
      });

      DOM.resetBgBtn.addEventListener('click', resetAll);
      DOM.downloadBtn.addEventListener('click', downloadCurrentModel);

      /* --------------------------------------------------------------------------
         7. シークレット・キーボードショートカット制御
         -------------------------------------------------------------------------- */
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        const key = e.key.toLowerCase();
        const orbit = DOM.viewer.getCameraOrbit();
        const theta = orbit ? orbit.theta : Math.PI / 2;

        // WASD: カメラ角度に連動した3D水平移動（前後左右）
        if (key === 'w') {
          STATE.position.x += Math.sin(theta) * CONFIG.MOVE_STEP;
          STATE.position.z += Math.cos(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        } else if (key === 's') {
          STATE.position.x -= Math.sin(theta) * CONFIG.MOVE_STEP;
          STATE.position.z -= Math.cos(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        } else if (key === 'a') {
          STATE.position.x += Math.cos(theta) * CONFIG.MOVE_STEP;
          STATE.position.z -= Math.sin(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        } else if (key === 'd') {
          STATE.position.x -= Math.cos(theta) * CONFIG.MOVE_STEP;
          STATE.position.z += Math.sin(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }

        // 矢印キー: 垂直移動（上下）
        if (e.key === 'ArrowUp') {
          STATE.position.y -= CONFIG.MOVE_STEP;
          updateCameraTarget();
        } else if (e.key === 'ArrowDown') {
          STATE.position.y += CONFIG.MOVE_STEP;
          updateCameraTarget();
        }

        // 数字キー: ポリゴン精度切り替え
        if (key === '1') selectModelIndex(0);
        else if (key === '2') selectModelIndex(1);
        else if (key === '3') selectModelIndex(2);

        // 表示モード切り替え
        if (key === 'n') selectMode('normal');
        else if (key === 'r') selectMode('solid');
        else if (key === 'h') selectMode('hologram');
        else if (key === 'm') selectMode('mesh');

        // 回転・スケール・背景制御
        if (key === 'l') DOM.toggleRotateBtn.click();
        else if (key === 'c') DOM.fastRotateBtn.click();
        else if (key === '+' || key === '=') setScaleValue(parseFloat(DOM.scaleSlider.value) + CONFIG.SCALE_STEP);
        else if (key === '-' || key === '_') setScaleValue(parseFloat(DOM.scaleSlider.value) - CONFIG.SCALE_STEP);
        else if (key === 'b') DOM.bgColorPicker.click();
        else if (key === 'p') DOM.bgImgInput.click();
        else if (key === 'q') resetAll();
      });

    })();
  </script>
