<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村瀨亮介 3D Model Preview</title>
  <!-- Google model-viewer 読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #666666; /* 既定の背景色 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* 下部コントロールパネル（レスポンシブ対応） */
    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: calc(100% - 32px);
      max-width: 720px;
      background: rgba(20, 20, 20, 0.85);
      padding: 10px 14px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .btn {
      background: transparent;
      color: #ccc;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .btn.active {
      color: #fff;
      background: #2563eb;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* スライダー調整 */
    .scale-label {
      color: #ccc;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .scale-slider {
      width: 75px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    /* カラーピッカーの装飾 */
    .color-picker-label {
      position: relative;
      overflow: hidden;
    }

    .color-picker-label input[type="color"] {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
    }

    input[type="file"] {
      display: none;
    }

    /* モバイル向け最適化 */
    @media (max-width: 480px) {
      .controls-panel {
        bottom: 12px;
        padding: 8px 10px;
        gap: 8px;
        border-radius: 16px;
      }
      .divider {
        display: none;
      }
      .btn {
        padding: 5px 10px;
        font-size: 11px;
      }
      .scale-slider {
        width: 60px;
      }
    }
  </style>
</head>
<body>

  <!-- コントロールパネル -->
  <div class="controls-panel">
    <!-- 1. ポリゴン数切替 -->
    <div class="group">
      <button class="btn" data-src="./murase_statue_bust_500p_low.glb">500p</button>
      <button class="btn active" data-src="./murase_statue_bust_15k_standard.glb">15k</button>
      <button class="btn" data-src="./murase_statue_bust_70k_raw.glb">70k</button>
    </div>

    <div class="divider"></div>

    <!-- 2. 自動回転ON/OFF -->
    <div class="group">
      <button class="btn active" id="toggleRotateBtn" title="自動回転のON/OFF">🔄 回転</button>
    </div>

    <div class="divider"></div>

    <!-- 3. モデルサイズ調整 -->
    <div class="group">
      <label class="scale-label">
        📏 サイズ
        <input type="range" id="scaleSlider" class="scale-slider" min="0.1" max="1.5" step="0.05" value="0.5">
      </label>
    </div>

    <div class="divider"></div>

    <!-- 4. 背景カスタマイズ -->
    <div class="group">
      <label class="btn color-picker-label" title="背景色を変更">
        🎨 色
        <input type="color" id="bgColorPicker" value="#666666">
      </label>

      <label class="btn" title="背景画像を読み込む">
        🖼️ 画像
        <input type="file" id="bgImgInput" accept="image/*">
      </label>

      <button class="btn" id="resetBgBtn" title="既定の状態に戻す">↺ リセット</button>
    </div>
  </div>

  <!-- 3Dビューワー（初期カメラ位置: 90deg で正面補正） -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    scale="0.5 0.5 0.5"
    camera-orbit="90deg 75deg auto"
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <!-- スクリプト制御 -->
  <script>
    const viewer = document.getElementById('viewer');
    const modelButtons = document.querySelectorAll('.controls-panel .group:first-child .btn');
    const toggleRotateBtn = document.getElementById('toggleRotateBtn');
    const scaleSlider = document.getElementById('scaleSlider');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const bgImgInput = document.getElementById('bgImgInput');
    const resetBgBtn = document.getElementById('resetBgBtn');

    const DEFAULT_SCALE = 0.5;

    // 1. モデル切替
    modelButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modelButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        viewer.src = btn.getAttribute('data-src');
      });
    });

    // 2. 自動回転のトグル処理
    toggleRotateBtn.addEventListener('click', () => {
      if (viewer.hasAttribute('auto-rotate')) {
        viewer.removeAttribute('auto-rotate');
        toggleRotateBtn.classList.remove('active');
      } else {
        viewer.setAttribute('auto-rotate', '');
        toggleRotateBtn.classList.add('active');
      }
    });

    // 3. モデルサイズ（スケール）調整
    scaleSlider.addEventListener('input', (e) => {
      const scale = e.target.value;
      viewer.scale = `${scale} ${scale} ${scale}`;
    });

    // 4. 背景色変更
    bgColorPicker.addEventListener('input', (e) => {
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = e.target.value;
    });

    // 5. 背景画像読み込み
    bgImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const imageUrl = URL.createObjectURL(file);
        document.body.style.backgroundImage = `url("${imageUrl}")`;
      }
    });

    // 6. リセット（背景・サイズ・回転を初期状態に戻す）
    resetBgBtn.addEventListener('click', () => {
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = '#666666';
      bgColorPicker.value = '#666666';
      bgImgInput.value = '';

      scaleSlider.value = DEFAULT_SCALE;
      viewer.scale = `${DEFAULT_SCALE} ${DEFAULT_SCALE} ${DEFAULT_SCALE}`;

      // 自動回転をONに戻す
      viewer.setAttribute('auto-rotate', '');
      toggleRotateBtn.classList.add('active');

      // カメラ角度を時計回り90度の正面に戻す
      viewer.cameraOrbit = '90deg 75deg auto';
    });
  </script>
</body>
</html>
