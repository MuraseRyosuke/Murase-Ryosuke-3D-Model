<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村瀨亮介 3D Model Preview</title>
  <!-- Google model-viewer 読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #666666; /* 既定の背景色 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* 上部コントロールパネル */
    .controls-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(20, 20, 20, 0.75);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .divider {
      width: 1px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .btn {
      background: transparent;
      color: #ccc;
      border: none;
      padding: 6px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }

    .btn.active {
      color: #fff;
      background: #2563eb;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    /* カラーピッカーの装飾 */
    .color-picker-label {
      position: relative;
      overflow: hidden;
    }

    .color-picker-label input[type="color"] {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
    }

    /* 非表示のファイル入力 */
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- コントロールパネル -->
  <div class="controls-panel">
    <!-- モデル精度切り替え -->
    <div class="group">
      <button class="btn" data-src="./murase_statue_bust_500p_low.glb">500p</button>
      <button class="btn active" data-src="./murase_statue_bust_15k_standard.glb">15k</button>
      <button class="btn" data-src="./murase_statue_bust_70k_raw.glb">70k</button>
    </div>

    <div class="divider"></div>

    <!-- 背景カスタマイズ -->
    <div class="group">
      <!-- 色選択ボタン -->
      <label class="btn color-picker-label" title="背景色を変更">
        🎨 色
        <input type="color" id="bgColorPicker" value="#666666">
      </label>

      <!-- 画像アップロードボタン -->
      <label class="btn" title="背景画像を読み込む">
        🖼️ 画像
        <input type="file" id="bgImgInput" accept="image/*">
      </label>

      <!-- 背景リセットボタン -->
      <button class="btn" id="resetBgBtn" title="既定の背景（#666666）に戻す">↺ リセット</button>
    </div>
  </div>

  <!-- 3Dビューワー -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    auto-rotate 
    camera-controls 
    shadow-intensity="1">
  </model-viewer>

  <!-- スクリプト制御 -->
  <script>
    const viewer = document.getElementById('viewer');
    const modelButtons = document.querySelectorAll('.controls-panel .group:first-child .btn');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const bgImgInput = document.getElementById('bgImgInput');
    const resetBgBtn = document.getElementById('resetBgBtn');

    // 1. モデル切替処理
    modelButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        modelButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        viewer.src = btn.getAttribute('data-src');
      });
    });

    // 2. 背景色変更処理
    bgColorPicker.addEventListener('input', (e) => {
      document.body.style.backgroundImage = 'none'; // 画像を解除
      document.body.style.backgroundColor = e.target.value;
    });

    // 3. 背景画像読み込み処理
    bgImgInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const imageUrl = URL.createObjectURL(file);
        document.body.style.backgroundImage = `url("${imageUrl}")`;
      }
    });

    // 4. 背景リセット処理 (#666666 に戻す)
    resetBgBtn.addEventListener('click', () => {
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = '#666666';
      bgColorPicker.value = '#666666';
      bgImgInput.value = ''; // ファイル選択をクリア
    });
  </script>
</body>
</html>
