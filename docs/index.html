<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>村瀨亮介 3D Model Preview</title>

  <!-- ファビコン設定 -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

  <!-- Google model-viewer スクリプト読み込み -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* ==========================================================================
       1. デザインシステム & 基本スタイル
       ========================================================================== */
    :root {
      --bg-default: #666666;
      --accent-blue: #2563eb;
      --accent-red: #e11d48;
      --gt-green: #34d399;

      --text-main: #ffffff;
      --text-sub: #d1d5db;
      --text-muted: rgba(255, 255, 255, 0.4);

      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: var(--bg-default);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      transition: background-color 0.3s ease;
    }

    /* 背景用リアカメラ映像 */
    #cameraVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* 3Dキャンバス */
    model-viewer {
      position: relative;
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      transition: filter 0.3s ease;
      z-index: 1;
    }

    /* ==========================================================================
       2. GT7 / スーパーフォーミュラ風 レーシングスペックUI (左側)
       ========================================================================== */
    .gt-spec-overlay {
      position: absolute;
      top: 24px;
      left: 28px;
      z-index: 20;
      max-width: 320px;
      color: var(--text-main);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      opacity: 1;
      transform: translateX(0);
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
    }

    .gt-spec-overlay.is-hidden {
      opacity: 0 !important;
      transform: translateX(-24px) !important;
      pointer-events: none !important;
    }

    .gt-formula-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .gt-country {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2px;
      letter-spacing: 0.05em;
    }

    .gt-name-main {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: #ffffff;
    }

    .gt-name-sub {
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 2px;
    }

    .gt-pp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 10px;
      padding: 2px 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: rgba(0, 0, 0, 0.35);
    }

    .gt-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
      margin-bottom: 10px;
    }

    .gt-spec-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
    }

    .gt-spec-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .gt-spec-label {
      width: 68px;
      color: rgba(255, 255, 255, 0.55);
      font-size: 11px;
      font-weight: 400;
      flex-shrink: 0;
    }

    .gt-spec-val {
      font-weight: 600;
      color: #ffffff;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .gt-spec-val span {
      font-size: 10px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      margin-left: 2px;
    }

    .gt-status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    .gt-status-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .gt-status-tag {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.5);
    }

    .gt-status-icon {
      font-size: 11px;
    }

    .gt-status-text {
      font-size: 9px;
      font-weight: 700;
      color: var(--gt-green);
      letter-spacing: 0.04em;
    }

    .gt-mobile-toggle-btn {
      position: absolute;
      top: 18px;
      left: 16px;
      z-index: 25;
      background: rgba(15, 18, 24, 0.75);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
    }

    /* ==========================================================================
       3. GT7風 通知トースト演出 (「クルマを乗り換えました」等)
       ========================================================================== */
    .gt-toast {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(12, 15, 20, 0.85);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 40;
      white-space: nowrap;
    }

    .gt-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       4. GT7風 ガレージ下部メニューバー (完全再現)
       ========================================================================== */
    .gt-garage-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      background: linear-gradient(180deg, transparent 0%, rgba(10, 12, 16, 0.6) 20%, rgba(5, 7, 10, 0.95) 100%);
      padding-top: 12px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    /* L1 ・ ・ ・ ・ ・ R1 ページネーションライン */
    .gt-page-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      opacity: 0.45;
    }

    .gt-shoulder-btn {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    .gt-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gt-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
      opacity: 0.3;
    }

    .gt-dot.active {
      opacity: 1;
      transform: scale(1.2);
    }

    /* サブメニュー展開コンテナ */
    .gt-sub-bar {
      margin-bottom: 12px;
      background: rgba(20, 24, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 6px 10px;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: subMenuPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .gt-sub-bar.active {
      display: inline-flex;
    }

    @keyframes subMenuPop {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .gt-sub-btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .gt-sub-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .gt-sub-btn.active {
      background: var(--accent-blue);
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.7);
    }

    .gt-sub-btn.fast-active {
      background: var(--accent-red);
      border-color: #f43f5e;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(225, 29, 72, 0.8);
    }

    /* メインアイコンボタングループ */
    .gt-main-menu {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 24px;
      width: 100%;
      max-width: 960px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .gt-main-menu::-webkit-scrollbar {
      display: none;
    }

    .gt-menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all var(--transition-fast);
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gt-menu-item:hover, .gt-menu-item.active {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .gt-menu-item:active {
      transform: scale(0.94);
    }

    .gt-menu-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gt-menu-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all var(--transition-fast);
    }

    .gt-menu-item.active .gt-menu-icon svg {
      stroke: #60a5fa;
      filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.8));
    }

    .gt-menu-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* クルマ図鑑の通知バッジ (423) */
    .gt-badge {
      position: absolute;
      top: -4px;
      right: -8px;
      background: #e11d48;
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    /* スライダー装飾 */
    .gt-slider {
      width: 120px;
      height: 20px;
      accent-color: var(--accent-blue);
      cursor: pointer;
    }

    /* 隠しインプット */
    input[type="color"], input[type="file"] {
      display: none;
    }

    /* ==========================================================================
       5. ARボタン & ホログラムエフェクト
       ========================================================================== */
    .ar-fab-btn {
      position: absolute;
      top: 20px;
      right: 16px;
      z-index: 100;
      background: rgba(37, 99, 235, 0.9);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }

    .ar-fab-btn:active {
      transform: scale(0.95);
      background: #1d4ed8;
    }

    .holo-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 240, 255, 0.08) 0px,
        rgba(0, 240, 255, 0.08) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 5;
    }

    .holo-overlay.active {
      opacity: 1;
    }

    /* ==========================================================================
       6. モバイル向けレスポンシブ最適化
       ========================================================================== */
    @media (max-width: 640px) {
      .gt-spec-overlay {
        top: 60px;
        left: 20px;
        max-width: 280px;
      }

      .gt-mobile-toggle-btn {
        display: inline-flex;
      }

      .gt-main-menu {
        justify-content: flex-start;
        gap: 16px;
      }

      .gt-menu-label {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- 背景用リアカメラビデオ要素 -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <!-- ホログラムモード用エフェクトオーバーレイ -->
  <div id="holoOverlay" class="holo-overlay"></div>

  <!-- スマホ用 SPEC 再表示トグルボタン -->
  <button id="gtToggleBtn" class="gt-mobile-toggle-btn">
    ℹ️ SPEC
  </button>

  <!-- GT7風 トースト演出 -->
  <div id="gtToast" class="gt-toast">クルマを乗り換えました</div>

  <!-- GT7 / フォーミュラ風 スペックオーバーレイ (左上配置) -->
  <div id="gtSpecOverlay" class="gt-spec-overlay">
    <div class="gt-formula-badge">FORMULA SPEC</div>

    <div class="gt-country">
      <span>🇯🇵</span>
      <span>北海道 旭川 / ASAHIKAWA HOKKAIDO</span>
    </div>

    <div class="gt-name-main">村瀨亮介 '96</div>
    <div class="gt-name-sub">Ryosuke MURASE / Single-Seater Humanoid</div>

    <div class="gt-pp-badge">
      PP 596.24
    </div>

    <div class="gt-divider"></div>

    <div class="gt-spec-list">
      <div class="gt-spec-row">
        <span class="gt-spec-label">車両乾燥重量</span>
        <span class="gt-spec-val">87<span>kg</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">全高 (身長)</span>
        <span class="gt-spec-val">172<span>cm</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">駆動形式</span>
        <span class="gt-spec-val">MR<span>(ミッドシップ 2WD)</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">主要燃料</span>
        <span class="gt-spec-val">カレー<span>(Curry & Spices)</span></span>
      </div>
      <div class="gt-spec-row">
        <span class="gt-spec-label">総ポリゴン</span>
        <span class="gt-spec-val" id="specPolyVal">15,000<span>Tris</span></span>
      </div>
    </div>

    <div class="gt-status-row">
      <div class="gt-status-item">
        <span class="gt-status-tag">PU</span>
        <span class="gt-status-icon">⚙️</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">CHASSIS</span>
        <span class="gt-status-icon">🛡️</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">ENERGY</span>
        <span class="gt-status-icon">⚡</span>
        <span class="gt-status-text">良好</span>
      </div>
      <div class="gt-status-item">
        <span class="gt-status-tag">SYSTEM</span>
        <span class="gt-status-icon">🟢</span>
        <span class="gt-status-text">良好</span>
      </div>
    </div>
  </div>

  <!-- 3Dモデルビューワー -->
  <model-viewer 
    id="viewer"
    src="./murase_statue_bust_15k_standard.glb" 
    alt="村瀨亮介 3D Model Preview" 
    scale="0.5 0.5 0.5"
    camera-orbit="90deg 75deg auto"
    camera-target="0m 0m 0m"
    auto-rotate 
    rotation-per-second="30deg"
    camera-controls 
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look">

    <button slot="ar-button" class="ar-fab-btn">
      👓 AR表示
    </button>
  </model-viewer>

  <!-- ==========================================================================
       GT7風 ガレージ下部メニューバー
       ========================================================================== -->
  <div class="gt-garage-bottom">
    <!-- ページインジケーター -->
    <div class="gt-page-indicator">
      <span class="gt-shoulder-btn">L1</span>
      <div class="gt-dots">
        <span class="gt-dot active"></span>
        <span class="gt-dot"></span>
        <span class="gt-dot"></span>
        <span class="gt-dot"></span>
        <span class="gt-dot"></span>
        <span class="gt-dot"></span>
      </div>
      <span class="gt-shoulder-btn">R1</span>
    </div>

    <!-- サブメニュー 1: 乗り換え (モデル選択) -->
    <div id="subSwitch" class="gt-sub-bar">
      <button class="gt-sub-btn" data-src="./murase_statue_bust_500p_low.glb" data-poly="500">500p Low</button>
      <button class="gt-sub-btn active" data-src="./murase_statue_bust_15k_standard.glb" data-poly="15,000">15k Standard</button>
      <button class="gt-sub-btn" data-src="./murase_statue_bust_70k_raw.glb" data-poly="70,000">70k Raw</button>
    </div>

    <!-- サブメニュー 2: カーセッティング (表示モード) -->
    <div id="subSetting" class="gt-sub-bar">
      <button class="gt-sub-btn active" data-mode="normal">標準テクスチャ</button>
      <button class="gt-sub-btn" data-mode="solid">ソリッド</button>
      <button class="gt-sub-btn" data-mode="hologram">ホログラム</button>
      <button class="gt-sub-btn" data-mode="mesh">メッシュ (ワイヤー)</button>
    </div>

    <!-- サブメニュー 3: クルマを見る (回転操作) -->
    <div id="subView" class="gt-sub-bar">
      <button id="toggleRotateBtn" class="gt-sub-btn active">360° 自動回転</button>
      <button id="fastRotateBtn" class="gt-sub-btn">🎠 高速回転</button>
    </div>

    <!-- サブメニュー 4: スケープス (背景環境) -->
    <div id="subScapes" class="gt-sub-bar">
      <button id="cameraBtn" class="gt-sub-btn">📷 カメラ背景</button>
      <label class="gt-sub-btn">🎨 背景色 <input type="color" id="bgColorPicker" value="#666666"></label>
      <label class="gt-sub-btn">🖼️ 背景画像 <input type="file" id="bgImgInput" accept="image/*"></label>
      <button id="resetBgBtn" class="gt-sub-btn">↺ 既定に戻す</button>
    </div>

    <!-- サブメニュー 5: ディテール (サイズ調整) -->
    <div id="subScale" class="gt-sub-bar">
      <span style="font-size:12px; font-weight:600; color:var(--text-sub);">スケール:</span>
      <input type="range" id="scaleSlider" class="gt-slider" min="0.1" max="1.5" step="0.05" value="0.5">
    </div>

    <!-- メインメニューアイコンバー -->
    <div class="gt-main-menu">
      <!-- 1. 乗り換え -->
      <button class="gt-menu-item active" data-sub="subSwitch">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="m21 2-2 2m-1.5 1.5L14 9l-1.5-1.5L11 9l-1.5-1.5L8 9l-2-2a5 5 0 1 0-4 4l9.5 9.5a2.12 2.12 0 0 0 3 0l6.5-6.5a2.12 2.12 0 0 0 0-3L21 2z"/></svg>
        </div>
        <span class="gt-menu-label">乗り換え</span>
      </button>

      <!-- 2. カーセッティング -->
      <button class="gt-menu-item" data-sub="subSetting">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <span class="gt-menu-label">カーセッティング</span>
      </button>

      <!-- 3. クルマを見る -->
      <button class="gt-menu-item" data-sub="subView">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </div>
        <span class="gt-menu-label">クルマを見る</span>
      </button>

      <!-- 4. スケープス -->
      <button class="gt-menu-item" data-sub="subScapes">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="m8 3 4 8 5-5 5 11H2L8 3z"/><circle cx="17.5" cy="6.5" r="1.5"/></svg>
        </div>
        <span class="gt-menu-label">スケープス</span>
      </button>

      <!-- 5. ディテール -->
      <button class="gt-menu-item" data-sub="subScale">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </div>
        <span class="gt-menu-label">ディテール</span>
      </button>

      <!-- 6. ギフト (DL) -->
      <button class="gt-menu-item" id="downloadBtn">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="14" rx="2"/><path d="M12 8v14"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
        </div>
        <span class="gt-menu-label">ギフト (DL)</span>
      </button>

      <!-- 7. クルマ図鑑 (GitHub) -->
      <a href="https://github.com/MuraseRyosuke/Murase-Ryosuke-3D-Model" target="_blank" rel="noopener noreferrer" class="gt-menu-item">
        <div class="gt-menu-icon">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="gt-badge">423</span>
        </div>
        <span class="gt-menu-label">クルマ図鑑</span>
      </a>
    </div>
  </div>

  <!-- スクリプト制御ロジック -->
  <script>
    (() => {
      'use strict';

      const CONFIG = {
        DEFAULT_SCALE: 0.5,
        DEFAULT_BG_COLOR: '#666666',
        NORMAL_ROTATION_SPEED: '30deg',
        FAST_ROTATION_SPEED: '1440deg',
        MOVE_STEP: 0.05
      };

      const isMobileDevice = window.innerWidth <= 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      const STATE = {
        currentMode: 'normal',
        isFastRotating: false,
        isCameraActive: false,
        cameraStream: null,
        originalMaterials: [],
        position: { x: 0, y: 0, z: 0 },
        isMobile: isMobileDevice
      };

      const DOM = {
        viewer: document.getElementById('viewer'),
        gtSpecOverlay: document.getElementById('gtSpecOverlay'),
        gtToggleBtn: document.getElementById('gtToggleBtn'),
        specPolyVal: document.getElementById('specPolyVal'),
        gtToast: document.getElementById('gtToast'),
        menuItems: document.querySelectorAll('.gt-menu-item[data-sub]'),
        subBars: document.querySelectorAll('.gt-sub-bar'),
        modelButtons: document.querySelectorAll('#subSwitch .gt-sub-btn'),
        modeButtons: document.querySelectorAll('#subSetting .gt-sub-btn'),
        holoOverlay: document.getElementById('holoOverlay'),
        toggleRotateBtn: document.getElementById('toggleRotateBtn'),
        fastRotateBtn: document.getElementById('fastRotateBtn'),
        scaleSlider: document.getElementById('scaleSlider'),
        cameraBtn: document.getElementById('cameraBtn'),
        cameraVideo: document.getElementById('cameraVideo'),
        bgColorPicker: document.getElementById('bgColorPicker'),
        bgImgInput: document.getElementById('bgImgInput'),
        resetBgBtn: document.getElementById('resetBgBtn'),
        downloadBtn: document.getElementById('downloadBtn')
      };

      /* ==========================================================================
         トースト通知演出
         ========================================================================== */
      let toastTimer = null;
      const showToast = (msg) => {
        DOM.gtToast.textContent = msg;
        DOM.gtToast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          DOM.gtToast.classList.remove('show');
        }, 2200);
      };

      /* ==========================================================================
         GT7 サブメニュー展開制御
         ========================================================================== */
      DOM.menuItems.forEach(item => {
        item.addEventListener('click', () => {
          const targetSubId = item.getAttribute('data-sub');
          const targetSub = document.getElementById(targetSubId);

          const isAlreadyActive = item.classList.contains('active') && targetSub && targetSub.classList.contains('active');

          DOM.menuItems.forEach(m => m.classList.remove('active'));
          DOM.subBars.forEach(s => s.classList.remove('active'));

          if (!isAlreadyActive && targetSub) {
            item.classList.add('active');
            targetSub.classList.add('active');
          }
        });
      });

      /* ==========================================================================
         GT7スペック表示制御（モバイル自動フェードアウト）
         ========================================================================== */
      let specFadeTimer = null;
      const hideSpecOverlay = () => DOM.gtSpecOverlay.classList.add('is-hidden');
      const showSpecOverlay = () => DOM.gtSpecOverlay.classList.remove('is-hidden');

      if (STATE.isMobile) {
        specFadeTimer = setTimeout(hideSpecOverlay, 3500);
      }

      DOM.gtToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (DOM.gtSpecOverlay.classList.contains('is-hidden')) {
          showSpecOverlay();
          if (specFadeTimer) clearTimeout(specFadeTimer);
          specFadeTimer = setTimeout(hideSpecOverlay, 4000);
        } else {
          hideSpecOverlay();
        }
      });

      /* ==========================================================================
         3Dビューワー・マテリアル・レンダリング制御
         ========================================================================== */
      const updateCameraTarget = () => {
        const { x, y, z } = STATE.position;
        DOM.viewer.cameraTarget = `${x.toFixed(2)}m ${y.toFixed(2)}m ${z.toFixed(2)}m`;
      };

      const configureSceneNodes = (isMeshMode) => {
        const symbols = Object.getOwnPropertySymbols(DOM.viewer);
        const sceneSymbol = symbols.find(s => s.description === 'scene') || Symbol.for('scene');
        const scene = DOM.viewer[sceneSymbol];

        if (scene) {
          scene.traverse((node) => {
            if (node.isMesh) {
              node.frustumCulled = false;
              if (node.material) {
                if (Array.isArray(node.material)) {
                  node.material.forEach(m => { m.wireframe = isMeshMode; });
                } else {
                  node.material.wireframe = isMeshMode;
                }
              }
            }
          });
        }
      };

      const cacheOriginalMaterials = () => {
        if (!DOM.viewer.model) return;
        STATE.originalMaterials = DOM.viewer.model.materials.map(mat => ({
          baseColorFactor: [...mat.pbrMetallicRoughness.baseColorFactor],
          baseColorTexture: mat.pbrMetallicRoughness.baseColorTexture.texture,
          roughnessFactor: mat.pbrMetallicRoughness.roughnessFactor,
          metallicFactor: mat.pbrMetallicRoughness.metallicFactor,
          emissiveFactor: [...mat.emissiveFactor],
          alphaMode: mat.alphaMode
        }));
      };

      const applyViewMode = (mode) => {
        STATE.currentMode = mode;
        if (!DOM.viewer.model) return;

        configureSceneNodes(mode === 'mesh');
        const materials = DOM.viewer.model.materials;

        materials.forEach((mat, idx) => {
          const orig = STATE.originalMaterials[idx];

          switch (mode) {
            case 'normal':
              if (orig) {
                mat.pbrMetallicRoughness.setBaseColorFactor(orig.baseColorFactor);
                mat.pbrMetallicRoughness.baseColorTexture.setTexture(orig.baseColorTexture);
                mat.pbrMetallicRoughness.setRoughnessFactor(orig.roughnessFactor);
                mat.pbrMetallicRoughness.setMetallicFactor(orig.metallicFactor);
                mat.setEmissiveFactor(orig.emissiveFactor);
                mat.setAlphaMode(orig.alphaMode);
              }
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;

            case 'solid':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.85, 0.85, 0.85, 1.0]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.5);
              mat.pbrMetallicRoughness.setMetallicFactor(0.1);
              mat.setEmissiveFactor([0, 0, 0]);
              mat.setAlphaMode('OPAQUE');
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;

            case 'hologram':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 0.8, 1.0, 0.5]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.2);
              mat.pbrMetallicRoughness.setMetallicFactor(0.8);
              mat.setEmissiveFactor([0.0, 0.6, 1.0]);
              mat.setAlphaMode('BLEND');
              DOM.holoOverlay.classList.add('active');
              DOM.viewer.style.filter = 'drop-shadow(0 0 15px rgba(0, 229, 255, 0.75))';
              break;

            case 'mesh':
              mat.pbrMetallicRoughness.baseColorTexture.setTexture(null);
              mat.pbrMetallicRoughness.setBaseColorFactor([0.0, 1.0, 0.5, 1.0]);
              mat.pbrMetallicRoughness.setRoughnessFactor(0.1);
              mat.pbrMetallicRoughness.setMetallicFactor(0.1);
              mat.setEmissiveFactor([0.0, 0.8, 0.4]);
              mat.setAlphaMode('OPAQUE');
              DOM.holoOverlay.classList.remove('active');
              DOM.viewer.style.filter = 'none';
              break;
          }
        });
      };

      const selectModelIndex = (index) => {
        if (DOM.modelButtons[index]) {
          DOM.modelButtons.forEach(btn => btn.classList.remove('active'));
          DOM.modelButtons[index].classList.add('active');
          DOM.viewer.src = DOM.modelButtons[index].getAttribute('data-src');

          const polyCount = DOM.modelButtons[index].getAttribute('data-poly');
          if (polyCount) {
            DOM.specPolyVal.innerHTML = `${polyCount}<span>Tris</span>`;
          }
          showToast('クルマを乗り換えました');
        }
      };

      const selectMode = (mode) => {
        DOM.modeButtons.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
        });
        applyViewMode(mode);
        showToast('セッティングを適用しました');
      };

      const startFastRotate = () => {
        STATE.isFastRotating = true;
        DOM.viewer.setAttribute('auto-rotate', '');
        DOM.viewer.setAttribute('rotation-per-second', CONFIG.FAST_ROTATION_SPEED);
        DOM.fastRotateBtn.classList.add('fast-active');
        DOM.toggleRotateBtn.classList.add('active');
        showToast('高速回転を開始しました 🎠');
      };

      const stopFastRotate = () => {
        STATE.isFastRotating = false;
        DOM.viewer.setAttribute('rotation-per-second', CONFIG.NORMAL_ROTATION_SPEED);
        DOM.fastRotateBtn.classList.remove('fast-active');
      };

      const setScaleValue = (val) => {
        const clamped = Math.min(Math.max(val, 0.1), 1.5);
        DOM.scaleSlider.value = clamped;
        DOM.viewer.scale = `${clamped} ${clamped} ${clamped}`;
      };

      const startCamera = async () => {
        try {
          STATE.cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
          DOM.cameraVideo.srcObject = STATE.cameraStream;
          DOM.cameraVideo.style.display = 'block';
          document.body.style.backgroundColor = 'transparent';
          document.body.style.backgroundImage = 'none';
          DOM.cameraBtn.classList.add('active');
          STATE.isCameraActive = true;
          showToast('スケープス: カメラ背景を起動しました');
        } catch (err) {
          alert('カメラの起動に失敗しました。');
        }
      };

      const stopCamera = () => {
        if (STATE.cameraStream) {
          STATE.cameraStream.getTracks().forEach(track => track.stop());
          STATE.cameraStream = null;
        }
        DOM.cameraVideo.style.display = 'none';
        document.body.style.backgroundColor = DOM.bgColorPicker.value;
        DOM.cameraBtn.classList.remove('active');
        STATE.isCameraActive = false;
      };

      const resetAll = () => {
        stopCamera();
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = CONFIG.DEFAULT_BG_COLOR;
        DOM.bgColorPicker.value = CONFIG.DEFAULT_BG_COLOR;
        DOM.bgImgInput.value = '';

        setScaleValue(CONFIG.DEFAULT_SCALE);

        STATE.position = { x: 0, y: 0, z: 0 };
        DOM.viewer.cameraTarget = 'auto auto auto';

        stopFastRotate();
        DOM.viewer.setAttribute('auto-rotate', '');
        DOM.toggleRotateBtn.classList.add('active');
        DOM.viewer.cameraOrbit = '90deg 75deg auto';

        selectMode('normal');
        showToast('ガレージを既定状態にリセットしました');
      };

      const downloadCurrentModel = () => {
        const currentSrc = DOM.viewer.src;
        if (!currentSrc) return;
        const fileName = currentSrc.split('/').pop();
        const a = document.createElement('a');
        a.href = currentSrc;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('ギフトを受け取りました (DL完了) 🎁');
      };

      /* ==========================================================================
         イベントリスナー
         ========================================================================== */
      DOM.viewer.addEventListener('load', () => {
        cacheOriginalMaterials();
        applyViewMode(STATE.currentMode);
      });

      DOM.modelButtons.forEach((btn, idx) => {
        btn.addEventListener('click', () => selectModelIndex(idx));
      });

      DOM.modeButtons.forEach((btn) => {
        btn.addEventListener('click', () => selectMode(btn.getAttribute('data-mode')));
      });

      DOM.toggleRotateBtn.addEventListener('click', () => {
        if (DOM.viewer.hasAttribute('auto-rotate')) {
          DOM.viewer.removeAttribute('auto-rotate');
          DOM.toggleRotateBtn.classList.remove('active');
          if (STATE.isFastRotating) stopFastRotate();
          showToast('回転を停止しました');
        } else {
          DOM.viewer.setAttribute('auto-rotate', '');
          DOM.toggleRotateBtn.classList.add('active');
          showToast('自動回転を開始しました');
        }
      });

      DOM.fastRotateBtn.addEventListener('click', () => {
        if (STATE.isFastRotating) stopFastRotate();
        else startFastRotate();
      });

      DOM.scaleSlider.addEventListener('input', (e) => {
        setScaleValue(parseFloat(e.target.value));
      });

      DOM.cameraBtn.addEventListener('click', async () => {
        if (STATE.isCameraActive) stopCamera();
        else await startCamera();
      });

      DOM.bgColorPicker.addEventListener('input', (e) => {
        stopCamera();
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = e.target.value;
      });

      DOM.bgImgInput.addEventListener('change', (e) => {
        stopCamera();
        const file = e.target.files[0];
        if (file) {
          const imageUrl = URL.createObjectURL(file);
          document.body.style.backgroundImage = `url("${imageUrl}")`;
          showToast('スケープス: 背景画像を設定しました');
        }
      });

      DOM.resetBgBtn.addEventListener('click', resetAll);
      DOM.downloadBtn.addEventListener('click', downloadCurrentModel);

      /* ==========================================================================
         シークレット・キーボードショートカット
         ========================================================================== */
      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

        const key = e.key.toLowerCase();
        const orbit = DOM.viewer.getCameraOrbit();
        const theta = orbit ? orbit.theta : Math.PI / 2;

        if (key === 'w') {
          STATE.position.x += Math.sin(theta) * CONFIG.MOVE_STEP;
          STATE.position.z += Math.cos(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (key === 's') {
          STATE.position.x -= Math.sin(theta) * CONFIG.MOVE_STEP;
          STATE.position.z -= Math.cos(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (key === 'a') {
          STATE.position.x += Math.cos(theta) * CONFIG.MOVE_STEP;
          STATE.position.z -= Math.sin(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (key === 'd') {
          STATE.position.x -= Math.cos(theta) * CONFIG.MOVE_STEP;
          STATE.position.z += Math.sin(theta) * CONFIG.MOVE_STEP;
          updateCameraTarget();
        }

        if (e.key === 'ArrowUp') {
          STATE.position.y -= CONFIG.MOVE_STEP;
          updateCameraTarget();
        }
        if (e.key === 'ArrowDown') {
          STATE.position.y += CONFIG.MOVE_STEP;
          updateCameraTarget();
        }

        if (key === '1') selectModelIndex(0);
        if (key === '2') selectModelIndex(1);
        if (key === '3') selectModelIndex(2);

        if (key === 'n') selectMode('normal');
        if (key === 'r') selectMode('solid');
        if (key === 'h') selectMode('hologram');
        if (key === 'm') selectMode('mesh');

        if (key === 'l') DOM.toggleRotateBtn.click();
        if (key === 'c') DOM.fastRotateBtn.click();

        if (key === '+' || key === '=') setScaleValue(parseFloat(DOM.scaleSlider.value) + 0.05);
        if (key === '-' || key === '_') setScaleValue(parseFloat(DOM.scaleSlider.value) - 0.05);

        if (key === 'b') DOM.bgColorPicker.click();
        if (key === 'p') DOM.bgImgInput.click();
        if (key === 'q') resetAll();
      });

    })();
  </script>
</body>
</html>
